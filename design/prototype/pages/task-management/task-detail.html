  function getExportStageLabel(stage) {
    return stage === 'dry' ? 'Dry Run' : stage === 'official' ? 'Official Run' : 'All';
  }

  function getExportSampleSnapshotId(stage) {
    return 'snapshot-' + TASK_DATA.taskId + '-' + (stage || 'all') + '-v1';
  }

  /* ADR-029: outputs[] is the single source of truth; export reads the
     primary output's config directly instead of parsing configContent text. */
  function getExportConfigData() {
    var out = (TASK_DATA.outputs || [])[0];
    return out ? (out.config || {}) : {};
  }

  function getExportSequenceSubtype(config) {
    return (config && config.subtype) || '';
  }

  function getExportedByName() {
    return state.taskRole === 'reviewer' ? 'Mandy Chen' : 'Mandy Chen';
  }

  function getExportedById() {
    return state.taskRole === 'reviewer' ? 'mandy.chen' : 'mandy.chen';
  }

  function getAnnotatorId(name) {
    return String(name || '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'unknown_annotator';
  }

  function splitSentencePairText(text) {
    var value = String(text || '');
    var match = value.match(/^句子 A：(.*?)句子 B：(.*)$/);
    if (match) {
      return {
        sentence1: match[1].trim(),
        sentence2: match[2].trim()
      };
    }
    return { sentence1: value, sentence2: '' };
  }

  function cloneExportValue(value) {
    if (value == null) return null;
    return JSON.parse(JSON.stringify(value));
  }

  function buildExportSourceData(sample, config) {
    var sourceData = {
      text: state.lang === 'en' ? sample.textEn : sample.textZh,
      text_zh: sample.textZh,
      text_en: sample.textEn
    };
    if (TASK_DATA.taskTypeKey === 'sentence_pairs') {
      var pair = splitSentencePairText(sample.textZh);
      sourceData.sentence_1 = pair.sentence1;
      sourceData.sentence_2 = pair.sentence2;
      sourceData.sentence_1_field = config.sentence_1_field || 'sentence_1';
      sourceData.sentence_2_field = config.sentence_2_field || 'sentence_2';
    }
    return sourceData;
  }

  function buildExportReviewData(annotation, index) {
    var pending = annotation.reviewStatus === 'pending';
    var reviewData = {
      review_id: pending ? null : 'review-' + index,
      reviewer_id: pending ? null : getExportedById(),
      reviewer_name: pending ? null : getExportedByName(),
      reviewed_at: pending ? null : (annotation.submittedAt || null),
      decision: annotation.reviewStatus || 'pending',
      review_note: null
    };
    if (!pending && annotation.value) {
      reviewData.corrected_result = cloneExportValue(annotation.value);
    } else {
      reviewData.corrected_result = null;
    }
    return reviewData;
  }

  function buildTaskSpecificExportFields(sample, annotation, config) {
    var value = annotation && annotation.value ? annotation.value : null;
    var fields = {};
    if (TASK_DATA.taskTypeKey === 'single_sentence_classification') {
      fields.labels = value && value.labels ? value.labels.slice() : [];
      fields.labels_summary = fields.labels.join(', ');
      return fields;
    }
    if (TASK_DATA.taskTypeKey === 'single_sentence_va_scoring') {
      fields.valence = value && value.valence !== undefined ? value.valence : null;
      fields.arousal = value && value.arousal !== undefined ? value.arousal : null;
      return fields;
    }
    if (TASK_DATA.taskTypeKey === 'relation_extraction') {
      fields.relations = value && value.resultText ? [value.resultText] : [];
      fields.relations_summary = fields.relations.join(' | ');
      return fields;
    }
    if (TASK_DATA.taskTypeKey === 'sentence_pairs') {
      var pair = splitSentencePairText(sample.textZh);
      fields.pair_mode = config.pair_mode || 'entailment';
      fields.response_format = config.response_format || 'classification';
      fields.sentence_1_field = config.sentence_1_field || 'sentence_1';
      fields.sentence_2_field = config.sentence_2_field || 'sentence_2';
      fields.sentence_1 = pair.sentence1;
      fields.sentence_2 = pair.sentence2;
      fields.label = value && value.label ? value.label : null;
      fields.score = value && value.score !== undefined ? value.score : null;
      fields.unsure = value && value.unsure === true ? true : false;
      return fields;
    }
    if (TASK_DATA.taskTypeKey === 'sequence_labeling') {
      fields.sequence_labeling_subtype = getExportSequenceSubtype(config);
      /* FR-015i: outputs[] configs no longer carry `subtype`, so branch on
         the annotation value's actual shape — aspect-style results carry
         `aspects[]`, entity-style results carry `entities[]`. */
      if (value && Array.isArray(value.aspects)) {
        fields.original_sentence = state.lang === 'en' ? sample.textEn : sample.textZh;
        fields.corrected_sentence = value && value.corrected_sentence ? value.corrected_sentence : fields.original_sentence;
        fields.aspects = value && value.aspects ? value.aspects.slice() : [];
        fields.aspects_summary = fields.aspects.join(', ');
      } else {
        fields.entities = value && value.entities ? cloneExportValue(value.entities) : [];
        fields.entities_summary = fields.entities.map(function(entity) {
          return entity.type + ':' + entity.text;
        }).join(', ');
      }
      return fields;
    }
    return fields;
  }

  function buildExportAnnotationRecord(sample, annotation, sampleIndex, annotationIndex, config) {
    var annotationId = 'ann-' + sample.sampleId + '-' + (annotationIndex + 1);
    return {
      annotation_id: annotationId,
      annotator_id: getAnnotatorId(annotation.annotator),
      annotator_name: annotation.annotator,
      submitted_at: annotation.submittedAt || null,
      lead_time_seconds: null,
      is_draft: sample.status === 'draft',
      result: Object.assign(
        {},
        cloneExportValue(annotation.value) || {},
        buildTaskSpecificExportFields(sample, annotation, config)
      )
    };
  }

  /* Config-driven (constitution: Generalization-First) — one record per
     TASK_DATA.outputs[] entry (ADR-029), reading the shared
     OUTPUT_TYPE_IAA_REGISTRY plus any target_agreement_overrides; a newly
     registered output type needs no changes here. */
  function getAppliedIaaMetrics() {
    return (TASK_DATA.outputs || []).map(function(out) {
      var entry = getIaaEntry(out.type);
      if (!entry || entry.notApplicable) {
        return { output_type: out.type, metric: null, threshold: null };
      }
      return {
        output_type: out.type,
        metric: entry[state.lang] || entry.zh,
        threshold: getEffectiveTargetAgreement(out.type)
      };
    });
  }

  function buildJsonExportPayload(samples) {
    var exportedAt = new Date().toISOString();
    var config = getExportConfigData();
    return {
      manifest: {
        task_id: TASK_DATA.taskId,
        task_name: state.lang === 'en' ? TASK_DATA.taskNameEn : TASK_DATA.taskNameZh,
        task_type: TASK_DATA.taskTypeKey,
        export_format: 'json',
        exported_at: exportedAt,
        exported_by: getExportedByName(),
        schema_version: '1.0.0',
        run_stage: state.arStage,
        isolation_enabled: TASK_DATA.isolationEnabled,
        sampling_mode: TASK_DATA.samplingMode,
        sampling_value: TASK_DATA.samplingValue,
        applied_iaa_metrics: getAppliedIaaMetrics(),
        sample_snapshot_id: getExportSampleSnapshotId(state.arStage),
        excluded_annotation_assignments: getExcludedExportMetadata(state.arStage),
        applied_filters: {
          run_stage: state.arStage,
          submission_status: state.arStatus,
          annotators: state.arAnnotator === 'all' ? [] : [state.arAnnotator]
        }
      },
      items: samples.map(function(sample, sampleIndex) {
        return {
          task_id: TASK_DATA.taskId,
          task_name: state.lang === 'en' ? TASK_DATA.taskNameEn : TASK_DATA.taskNameZh,
          task_type: TASK_DATA.taskTypeKey,
          run_stage: sample.stage,
          sample_snapshot_id: getExportSampleSnapshotId(sample.stage),
          sample_id: sample.sampleId,
          source_data: buildExportSourceData(sample, config),
          annotation_status: sample.status,
          review_status: sample.annotations.every(function(annotation) { return annotation.reviewStatus === 'approved'; }) ? 'approved' : 'pending',
          created_at: sample.completedAt || null,
          updated_at: sample.completedAt || null,
          annotations: sample.annotations.map(function(annotation, annotationIndex) {
            return buildExportAnnotationRecord(sample, annotation, sampleIndex, annotationIndex, config);
          }),
          reviews: sample.annotations.map(function(annotation, annotationIndex) {
            return buildExportReviewData(annotation, sample.sampleId + '-' + (annotationIndex + 1));
          })
        };
      })
    };
  }

  function buildJsonMinExportPayload(samples) {
    var config = getExportConfigData();
    var excludedMetadata = getExcludedExportMetadata(state.arStage);
    var rows = [];
    samples.forEach(function(sample) {
      sample.annotations.forEach(function(annotation, annotationIndex) {
        var taskFields = buildTaskSpecificExportFields(sample, annotation, config);
        var reviewData = buildExportReviewData(annotation, sample.sampleId + '-' + (annotationIndex + 1));
        rows.push(Object.assign({
          task_id: TASK_DATA.taskId,
          task_name: state.lang === 'en' ? TASK_DATA.taskNameEn : TASK_DATA.taskNameZh,
          task_type: TASK_DATA.taskTypeKey,
          run_stage: sample.stage,
          sample_snapshot_id: getExportSampleSnapshotId(sample.stage),
          sample_id: sample.sampleId,
          source_data: buildExportSourceData(sample, config),
          annotation_status: sample.status,
          review_status: annotation.reviewStatus || 'pending',
          created_at: annotation.submittedAt || null,
          updated_at: annotation.submittedAt || null,
          annotation_id: 'ann-' + sample.sampleId + '-' + (annotationIndex + 1),
          annotator_id: getAnnotatorId(annotation.annotator),
          annotator_name: annotation.annotator,
          submitted_at: annotation.submittedAt || null,
          lead_time_seconds: null,
          is_draft: sample.status === 'draft',
          reviewer_id: reviewData.reviewer_id,
          reviewer_name: reviewData.reviewer_name,
          reviewed_at: reviewData.reviewed_at,
          decision: reviewData.decision,
          corrected_result_summary: reviewData.corrected_result ? getAnnotationResultDisplay({ value: reviewData.corrected_result }).tags[0] : null,
          excluded_annotation_assignments_count: excludedMetadata.reduce(function(sum, item) { return sum + item.sample_count; }, 0),
          excluded_annotation_assignments_ref: excludedMetadata.map(function(item) { return item.assignment_id; }).join(',')
        }, taskFields));
      });
    });
    return rows;
  }

  function downloadArExport(format) {
    var samples = getArFilteredSamples();
    var payload = format === 'json' ? buildJsonExportPayload(samples) : buildJsonMinExportPayload(samples);
    var exportedAt = new Date().toISOString();
    var stamp = exportedAt.slice(0, 19).replace(/[:T]/g, '-');
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    var suffix = format === 'json' ? 'json' : 'json-min';
    link.href = url;
    link.download = TASK_DATA.taskId + '-' + suffix + '-' + stamp + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function() { URL.revokeObjectURL(url); }, 0);
    return exportedAt;
  }

  function getArExportStageLabel(stage) {
    if (stage === 'dry') return t('arStageDry');
    if (stage === 'official') return t('arStageOfficial');
    return t('arStageBoth');
  }

  function renderArExportHistory() {
    var body = document.getElementById('arExportHistoryBody');
    var empty = document.getElementById('arExportHistoryEmpty');
    if (!body) return;
    var history = TASK_DATA.exportHistory || [];
    while (body.firstChild) body.removeChild(body.firstChild);
    if (history.length === 0) {
      if (empty) empty.classList.remove('hidden');
      renderArExportPagination(0);
      return;
    }
    if (empty) empty.classList.add('hidden');
    var totalPages = Math.max(1, Math.ceil(history.length / state.arExportPageSize));
    if (state.arExportPage > totalPages) state.arExportPage = totalPages;
    var start = (state.arExportPage - 1) * state.arExportPageSize;
    var pageRecords = history.slice(start, start + state.arExportPageSize);
    renderArExportPagination(history.length);
    pageRecords.forEach(function(record) {
      var tr = document.createElement('tr');
      var typeLabel = record.exportType === 'filtered' ? t('arExportTypeFiltered') : t('arExportTypeFull');
      var stageLabel = getArExportStageLabel(record.stage);
      var scopeText = record.scope === '__all__' ? t('arExportScopeAll') : record.scope;
      [record.exportedAt, typeLabel, stageLabel, record.count.toLocaleString(), scopeText, record.exportedBy].forEach(function(text, i) {
        var td = document.createElement('td');
        td.textContent = text;
        if (i === 3) td.style.textAlign = 'right';
        tr.appendChild(td);
      });
      var formatTd = document.createElement('td');
      var badge = document.createElement('span');
      badge.className = 'badge badge-draft';
      badge.textContent = record.format;
      formatTd.appendChild(badge);
      tr.appendChild(formatTd);
      var opsTd = document.createElement('td');
      var dlBtn = document.createElement('button');
      dlBtn.className = 'mini-btn mini-btn-primary ar-export-action-btn';
      dlBtn.type = 'button';
      dlBtn.textContent = t('arExportDownload');
      opsTd.appendChild(dlBtn);
      tr.appendChild(opsTd);
      body.appendChild(tr);
    });
  }

  function renderArExportPagination(total) {
    var bar = document.getElementById('arExportPaginationBar');
    if (!bar) return;
    bar.classList.toggle('hidden', total === 0);
    if (total === 0) return;

    var totalPages = Math.max(1, Math.ceil(total / state.arExportPageSize));

    var info = document.getElementById('arExportPaginationInfo');
    if (info) {
      info.textContent = t('arPaginationTpl')
        .replace('{total}', total)
        .replace('{page}', state.arExportPage)
        .replace('{totalPages}', totalPages);
    }

    var pageSizeSelect = document.getElementById('arExportPageSizeSelect');
    if (pageSizeSelect) {
      pageSizeSelect.value = String(state.arExportPageSize);
      Array.prototype.forEach.call(pageSizeSelect.options, function(opt) {
        opt.textContent = opt.value + t('arPageSizeLabel');
      });
    }

    var prevBtn = document.getElementById('arExportPrevPageBtn');
    var nextBtn = document.getElementById('arExportNextPageBtn');
    if (prevBtn) {
      prevBtn.disabled = state.arExportPage <= 1;
      prevBtn.setAttribute('aria-label', t('arPrevPageAria'));
    }
    if (nextBtn) {
      nextBtn.disabled = state.arExportPage >= totalPages;
      nextBtn.setAttribute('aria-label', t('arNextPageAria'));
    }

    var controls = document.getElementById('arExportPaginationControls');
    if (!controls || !nextBtn) return;

    Array.prototype.forEach.call(controls.querySelectorAll('[data-page]'), function(btn) {
      btn.remove();
    });

    var maxVisible = 5;
    var startPage = Math.max(1, state.arExportPage - 2);
    var endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    for (var pageNum = startPage; pageNum <= endPage; pageNum++) {
      (function(pg) {
        var btn = document.createElement('button');
        btn.className = 'page-btn' + (pg === state.arExportPage ? ' active' : '');
        btn.dataset.page = String(pg);
        btn.type = 'button';
        btn.textContent = String(pg);
        btn.addEventListener('click', function() {
          state.arExportPage = pg;
          renderArExportHistory();
        });
        nextBtn.insertAdjacentElement('beforebegin', btn);
      }(pageNum));
    }
  }

  function renderArPagination(total) {

    bar.classList.toggle('hidden', total === 0);

    if (info) {
      info.textContent = t('arPaginationTpl')
        .replace('{total}', total)
        .replace('{page}', state.arPage)
        .replace('{totalPages}', totalPages);
    }

    var pageSizeSelect = document.getElementById('arPageSizeSelect');
    if (pageSizeSelect) {
      pageSizeSelect.value = String(state.arPageSize);
      Array.prototype.forEach.call(pageSizeSelect.options, function(opt) {
        opt.textContent = opt.value + t('arPageSizeLabel');
      });
    }

    var prevBtn = document.getElementById('arPrevPageBtn');
    var nextBtn = document.getElementById('arNextPageBtn');
    if (prevBtn) {
      prevBtn.disabled = state.arPage <= 1;
      prevBtn.setAttribute('aria-label', t('arPrevPageAria'));
    }
    if (nextBtn) {
      nextBtn.disabled = state.arPage >= totalPages;
      nextBtn.setAttribute('aria-label', t('arNextPageAria'));
    }

    var controls = document.getElementById('arPaginationControls');
    if (!controls || !nextBtn) return;

    Array.prototype.forEach.call(controls.querySelectorAll('[data-page]'), function(btn) {
      btn.remove();
    });

    var maxVisible = 5;
    var startPage = Math.max(1, state.arPage - 2);
    var endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    for (var pageNum = startPage; pageNum <= endPage; pageNum++) {
      (function(pg) {
        var btn = document.createElement('button');
        btn.className = 'page-btn' + (pg === state.arPage ? ' active' : '');
        btn.dataset.page = String(pg);
        btn.type = 'button';
        btn.textContent = String(pg);
        btn.addEventListener('click', function() {
          state.arPage = pg;
          renderAnnotationResults();
        });
        nextBtn.insertAdjacentElement('beforebegin', btn);
      }(pageNum));
    }
  }

  function renderAnnotationResults() {
    var arStageSelect = document.getElementById('arStageSelect');
    var arStatusSelect = document.getElementById('arStatusSelect');
    if (arStageSelect) arStageSelect.value = state.arStage;
    if (arStatusSelect) arStatusSelect.value = state.arStatus;

    var arStageOpts = document.getElementById('arStageSelect');
    if (arStageOpts && arStageOpts.options.length >= 3) {
      arStageOpts.options[0].textContent = t('arStageAll');
      arStageOpts.options[1].textContent = t('arStageDry');
      arStageOpts.options[2].textContent = t('arStageOfficial');
    }
    var arStatusOpts = document.getElementById('arStatusSelect');
    if (arStatusOpts && arStatusOpts.options.length >= 4) {
      arStatusOpts.options[0].textContent = t('arStatusAll');
      arStatusOpts.options[1].textContent = t('arStatusSubmitted');
      arStatusOpts.options[2].textContent = t('arStatusDraft');
      arStatusOpts.options[3].textContent = t('arStatusPending');
    }

    renderArAnnotatorSelect();
    renderArReviewerSelect();
    renderArReviewStatusSelect();

    var samples = getArFilteredSamples();
    var tableSection = document.getElementById('arTableSection');
    var emptyState = document.getElementById('arEmptyState');
    var totalPages = Math.max(1, Math.ceil(samples.length / state.arPageSize));
    if (state.arPage > totalPages) state.arPage = totalPages;

    if (samples.length === 0) {
      if (tableSection) tableSection.classList.add('hidden');
      if (emptyState) emptyState.classList.remove('hidden');
    } else {
      if (tableSection) tableSection.classList.remove('hidden');
      if (emptyState) emptyState.classList.add('hidden');
      renderArResultTable(samples.slice((state.arPage - 1) * state.arPageSize, state.arPage * state.arPageSize));
    }

    renderArPagination(samples.length);
    renderArExportHistory();
  }

  function showToast(message, isError) {
    var toast = document.getElementById('toast');
    var msg = document.getElementById('toastMsg');
    msg.textContent = message;
    toast.classList.toggle('error', Boolean(isError));
    toast.classList.add('show');

    if (toastTimer) {
      clearTimeout(toastTimer);
    }
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 2400);
  }

  function trackEvent(name, extra) {
    if (!window.LabelSuiteAnalytics) return;
    window.LabelSuiteAnalytics.track(name, Object.assign({
      page: 'task-detail-overview',
      lang: state.lang,
      task_role: state.taskRole,

  function canPublish() {
    var result = validateSampling();
    if (!result.valid) {
      showToast(t('toastPublishBlocked'), true);
      trackEvent('prototype_publish_failed', { reason: result.message });
      renderSamplingState();
      return false;
    }
    var gapMessages = getMembershipGapMessages();
    if (gapMessages.length) {
      showToast(t('toastPublishBlockedMembers') + gapMessages.join(t('memberGapJoiner')), true);
      trackEvent('prototype_publish_failed', { reason: 'member_gap: ' + gapMessages.join(', ') });
      return false;
    }
    return true;
  }

  function publishDryRun() {
    if (state.publishingDryRun) return;
    if (!canPublish()) return;
    state.publishingDryRun = true;
    setTimeout(function() { state.publishingDryRun = false; }, 200);
    var nextRound = getTrialRounds().length + 1;
    var scenario = getTrialRoundScenario(nextRound);
    if (!Array.isArray(TASK_DATA.trialRounds)) TASK_DATA.trialRounds = [];
    TASK_DATA.trialRounds.push({
      round: nextRound,
      sampleCount: Number(TASK_DATA.samplingValue) || 0,
      agreement: scenario.agreement,
      annotators: Number(TASK_DATA.minAnnotators) || 0,
      std: scenario.std,
      result: scenario.result,
      usedSamples: Number(TASK_DATA.samplingValue) || 0,
      date: scenario.date,
      noteZh: scenario.noteZh,
      noteEn: scenario.noteEn
    });
    TASK_DATA.trialRound = nextRound;
    TASK_DATA.currentAgreement = scenario.agreement;
    TASK_DATA.currentAnnotators = Number(TASK_DATA.minAnnotators) || 0;
    TASK_DATA.currentStd = scenario.std;
    TASK_DATA.status = scenario.result === 'passed' ? 'waiting_iaa_confirmation' : 'dry_run_in_progress';
    TASK_DATA.updatedAt = scenario.date + ' 10:07';
    showToast(t('toastPublishedDry'));
    trackEvent('prototype_publish_success', { target_status: TASK_DATA.status });
    renderOverview();
  }

  /* FR-008b: task-completion blockers, localized. Condition 4 (final
     exception pool) is always scoped to `official_run` regardless of the
     annotation-progress panel's currently selected round (FR-008b point 4:
     "僅計 official_run 的待處置項目") -- unlike renderFinalExceptionPoolSection()
     above, this never follows getExceptionPoolRunType(). See
     task-detail.data.js's getTaskCompletionBlockers() doc comment for which
     of the five FR-008b conditions this prototype iteration wires live. */
  function getTaskCompletionBlockerMessages() {
    var detailData = window.LabelSuiteTaskDetailData;
    if (!detailData) return [];
    /* Condition 1 (submission complete) is NOT wired as a live gate here,
       same reasoning and same scope note as conditions 2/3/5 in
       task-detail.data.js's getTaskCompletionBlockers() doc comment:
       ANNOTATION_PROGRESS is decorative demo data never derived from the
       live publishOfficialRun()/publishComplete() click flow (unlike the
       exception pool below, which reads the REAL 015 dispute/arbitration
       state), so gating on it here would block completion for reasons
       unrelated to this task's actual submission state. Only FR-018's
       exception pool (this change's actual new gate) is live-wired. */
    var exceptionPoolPendingCount = detailData.getFinalExceptionPoolItems(TASK_DATA.taskId, 'official_run').length;
    var blockers = detailData.getTaskCompletionBlockers({
      submissionComplete: true,
      exceptionPoolPendingCount: exceptionPoolPendingCount
    });
    return blockers.map(function(blocker) {
      if (blocker.code === 'exception_pool_pending') {
        return interpolate(t('completeBlockerExceptionPoolTpl'), { count: blocker.count });
      }
      if (blocker.code === 'submission_incomplete') return t('completeBlockerSubmission');
      return '';
    }).filter(function(message) { return Boolean(message); });
  }

  function publishComplete() {
    var blockerMessages = getTaskCompletionBlockerMessages();
    if (blockerMessages.length) {
      showToast(t('toastCompleteBlocked') + blockerMessages.join(t('memberGapJoiner')), true);
      trackEvent('prototype_publish_failed', { reason: 'completion_blocked: ' + blockerMessages.join(', ') });
      return;
    }
    TASK_DATA.status = 'completed';
    TASK_DATA.updatedAt = '2026-05-06 18:20';
    showToast(t('toastPublishedComplete'));
    trackEvent('prototype_publish_success', { target_status: 'completed' });
    renderOverview();
  }

        renderArExportHistory();
      }
    });

    document.getElementById('arExportPageSizeSelect').addEventListener('change', function(e) {
      state.arExportPageSize = parseInt(e.target.value, 10) || 20;
      state.arExportPage = 1;
      renderArExportHistory();
    });

    document.getElementById('workLogDateFrom').addEventListener('change', function(e) {
      state.workLogDateFrom = e.target.value || '';
      state.wlPage = 1;
      updateWorkLogDatePlaceholderState(e.target);
      renderWorkLog();
      trackEvent('prototype_work_log_filter_changed', { filter: 'date_from' });
    });

    document.getElementById('workLogDateTo').addEventListener('change', function(e) {
      state.workLogDateTo = e.target.value || '';
      state.wlPage = 1;
      updateWorkLogDatePlaceholderState(e.target);
      renderWorkLog();
      trackEvent('prototype_work_log_filter_changed', { filter: 'date_to' });
    });

    document.getElementById('workLogStageSelect').addEventListener('change', function(e) {
      state.workLogStage = e.target.value || 'all';
      state.wlPage = 1;
      renderWorkLog();
      trackEvent('prototype_work_log_filter_changed', { filter: 'run_stage', value: state.workLogStage });
    });

    document.getElementById('workLogMemberSelect').addEventListener('change', function(e) {
      state.workLogMember = e.target.value || 'all';
      state.wlPage = 1;
      renderWorkLog();
      trackEvent('prototype_work_log_filter_changed', { filter: 'member', value: state.workLogMember });
    });

    var wlPrevPageBtn = document.getElementById('wlPrevPageBtn');
    if (wlPrevPageBtn) {
      wlPrevPageBtn.addEventListener('click', function() {
        if (state.wlPage > 1) {
          state.wlPage--;
          renderWorkLog();
        }
      });
    }

    var wlNextPageBtn = document.getElementById('wlNextPageBtn');
    if (wlNextPageBtn) {
      wlNextPageBtn.addEventListener('click', function() {
        var total = getFilteredWorkLogEntries().length;
        var totalPages = Math.max(1, Math.ceil(total / state.wlPageSize));
        if (state.wlPage < totalPages) {
          state.wlPage++;
          renderWorkLog();
        }
      });
    }

    var wlPageSizeSelect = document.getElementById('wlPageSizeSelect');
    if (wlPageSizeSelect) {
      wlPageSizeSelect.addEventListener('change', function(e) {
        state.wlPageSize = parseInt(e.target.value, 10) || 20;
        state.wlPage = 1;
        renderWorkLog();
      });
    }

    var langToggle = document.getElementById('langToggle');
    var mobileLangToggle = document.getElementById('mobileLangToggle');

    function onLangToggle() {
      var next = state.lang === 'zh' ? 'en' : 'zh';
      applyLang(next);
      trackEvent('prototype_lang_switched', { to_lang: next });
    }

    if (langToggle) langToggle.addEventListener('click', onLangToggle);
    if (mobileLangToggle) mobileLangToggle.addEventListener('click', onLangToggle);
  }

  function showOverviewWithSkeleton() {
    var skeleton = document.getElementById('loadingSkeleton');
    var overviewPanel = document.getElementById('overviewPanel');
    var annotationProgressPanel = document.getElementById('annotationProgressPanel');
    var workLogPanel = document.getElementById('workLogPanel');
    var memberManagementPanel = document.getElementById('memberManagementPanel');

    var annotationResultsPanel = document.getElementById('annotationResultsPanel');
    skeleton.classList.remove('hidden');
    overviewPanel.classList.add('hidden');
    annotationResultsPanel.classList.add('hidden');
    annotationProgressPanel.classList.add('hidden');
    workLogPanel.classList.add('hidden');
    memberManagementPanel.classList.add('hidden');

    window.setTimeout(function() {
      state.showSkeleton = false;
      skeleton.classList.add('hidden');
      renderTabs();
      renderOverview();
      renderMemberManagement();
      renderAnnotationResults();
      renderAnnotationProgress();
      renderWorkLog();
    }, 560);
  }

  function getTrackingContext() {
    return {
      task_role: state.taskRole,
      task_status: TASK_DATA.status,
      tab: state.activeTab,
      lang: state.lang,
    };
  }

  function init() {
    parseRole();
    if (TASK_NOT_FOUND) {
      renderTaskNotFoundState();
      return;
    }
    syncStatusFromDryRunProgress();

    state.lang = window.LabelSuiteSharedSidebar
      ? window.LabelSuiteSharedSidebar.getStoredLang()
      : 'zh';

    loadAllTabPanels()
      .then(function(loaded) {
        if (!loaded) {
          renderPanelLoadError();
          return;
        }

        applyLang(state.lang);
        bindEvents();
        bindTaskConfigEvents();
        showOverviewWithSkeleton();

        if (window.LabelSuiteAnalytics) {
          window.LabelSuiteAnalytics.init({ page: 'task-detail-overview' });
          window.LabelSuiteAnalytics.trackPageView('task-detail-overview', getTrackingContext);
        }
      })
      .catch(function() {
        renderPanelLoadError();
      });
  }

  init();
</script>
</body>
</html>
