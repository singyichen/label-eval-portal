  function isGuidelineEditable() {
    return TASK_DATA.status === 'draft' && state.taskRole === 'project_leader';
  }

  function getGuidelineRoleFieldName(role, field) {
    var prefix = role === 'reviewer' ? 'reviewer' : 'annotator';
    return prefix + field;
  }

  function getTaskGuidelineRoleText(role) {
    var zhField = getGuidelineRoleFieldName(role, 'GuidelineTextZh');
    var enField = getGuidelineRoleFieldName(role, 'GuidelineTextEn');
    var baseField = getGuidelineRoleFieldName(role, 'GuidelineText');
    if (state.lang === 'zh') {
      if (TASK_DATA[zhField]) return String(TASK_DATA[zhField]).trim();
      if (role !== 'reviewer' && TASK_DATA.guidelineTextZh) return String(TASK_DATA.guidelineTextZh).trim();
    } else {
      if (TASK_DATA[enField]) return String(TASK_DATA[enField]).trim();
      if (role !== 'reviewer' && TASK_DATA.guidelineTextEn) return String(TASK_DATA.guidelineTextEn).trim();
    }
    if (TASK_DATA[baseField]) return String(TASK_DATA[baseField]).trim();
    if (role !== 'reviewer' && TASK_DATA.guidelineText) return String(TASK_DATA.guidelineText).trim();
    return '';
  }

  function getTaskGuidelineRoleFiles(role) {
    var field = getGuidelineRoleFieldName(role, 'GuidelineFiles');
    if (Array.isArray(TASK_DATA[field])) {
      return TASK_DATA[field].map(function(file) {
        return { name: file.name, type: file.type };
      });
    }
    if (role !== 'reviewer' && Array.isArray(TASK_DATA.guidelineFiles)) {
      return TASK_DATA.guidelineFiles.map(function(file) {
        return { name: file.name, type: file.type };
      });
    }
    return [];
  }

  function hasTaskGuidelineRoleContent(role) {
    return Boolean(getTaskGuidelineRoleText(role) || getTaskGuidelineRoleFiles(role).length);
  }

  function createGuidelineDraft() {
    return {
      annotatorGuidelineText: getTaskGuidelineRoleText('annotator'),
      annotatorGuidelineFiles: getTaskGuidelineRoleFiles('annotator'),
      reviewerGuidelineText: getTaskGuidelineRoleText('reviewer'),
      reviewerGuidelineFiles: getTaskGuidelineRoleFiles('reviewer'),
      forceGuideline: Boolean(TASK_DATA.forceGuideline),
    };
  }

  function setGuidelineEditError(message) {
    var errorNode = document.getElementById('guidelineEditError');
    if (!errorNode) return;
    if (message) {
      errorNode.textContent = message;
      errorNode.classList.add('show');
      return;
    }
    errorNode.textContent = '';
    errorNode.classList.remove('show');
  }

  function getGuidelineFileType(fileName) {
    var parts = (fileName || '').toLowerCase().split('.');
    var ext = parts.length > 1 ? parts[parts.length - 1] : '';
    if (!ext) return 'file';
    if (ext === 'jpeg') return 'jpg';
    return ext;
  }

  function makeGuidelineFileSvg() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'guideline-item-icon');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z');
    var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    poly.setAttribute('points', '14 2 14 8 20 8');
    svg.appendChild(path);
    svg.appendChild(poly);
    return svg;
  }

  function createGuidelineUploadedFileItem(file) {
    var item = document.createElement('div');
    item.className = 'guideline-item';

    item.appendChild(makeGuidelineFileSvg());

    var nameSpan = document.createElement('span');
    nameSpan.className = 'guideline-item-name';
    nameSpan.textContent = file.name || '';
    item.appendChild(nameSpan);

    var typeSpan = document.createElement('span');
    typeSpan.className = 'guideline-item-type';
    typeSpan.textContent = String(file.type || getGuidelineFileType(file.name));
    item.appendChild(typeSpan);

    return item;
  }

  function renderGuidelineFileList(role) {
    var list = document.getElementById(role === 'reviewer' ? 'editReviewerGuidelineFileList' : 'editAnnotatorGuidelineFileList');
    var filesKey = role === 'reviewer' ? 'reviewerGuidelineFiles' : 'annotatorGuidelineFiles';
    if (!list) return;
    list.innerHTML = '';
    if (!state.guidelineDraft || !state.guidelineDraft[filesKey].length) return;

    state.guidelineDraft[filesKey].forEach(function(file, index) {
      var item = createGuidelineUploadedFileItem(file);

      var removeBtn = document.createElement('button');
      removeBtn.className = 'guideline-item-remove';
      removeBtn.type = 'button';
      removeBtn.setAttribute('aria-label', state.lang === 'zh' ? '移除附件' : 'Remove file');
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function() {
        if (!state.guidelineDraft) return;
        state.guidelineDraft[filesKey].splice(index, 1);
        renderGuidelineFileList(role);
        markGuidelineDirty();
      });
      item.appendChild(removeBtn);

      list.appendChild(item);
    });
  }

  function fillGuidelineEditForm() {
    if (!state.guidelineDraft) return;
    var annotatorGuidelineTextInput = document.getElementById('editAnnotatorGuidelineTextInput');
    var reviewerGuidelineTextInput = document.getElementById('editReviewerGuidelineTextInput');
    var forceToggle = document.getElementById('editForceGuidelineToggle');
    if (annotatorGuidelineTextInput) annotatorGuidelineTextInput.value = state.guidelineDraft.annotatorGuidelineText;
    if (reviewerGuidelineTextInput) reviewerGuidelineTextInput.value = state.guidelineDraft.reviewerGuidelineText;
    if (forceToggle) forceToggle.checked = state.guidelineDraft.forceGuideline;
    setGuidelineEditError('');
    renderGuidelineFileList('annotator');
    renderGuidelineFileList('reviewer');
  }

  function renderGuidelineEditState() {
    var editable = isGuidelineEditable();
    var editBtn = document.getElementById('guidelineEditBtn');
    var saveBtn = document.getElementById('guidelineSaveBtn');
    var cancelBtn = document.getElementById('guidelineCancelBtn');
    var form = document.getElementById('guidelineEditForm');
    var view = document.getElementById('guidelineSummaryView');
    var hint = document.getElementById('guidelineReadonlyHint');
    if (!editBtn || !saveBtn || !cancelBtn || !form || !view || !hint) return;

    editBtn.disabled = !editable;
    editBtn.classList.toggle('hidden', state.guidelineEditMode);
    saveBtn.classList.toggle('hidden', !state.guidelineEditMode);
    cancelBtn.classList.toggle('hidden', !state.guidelineEditMode);
    form.classList.toggle('hidden', !state.guidelineEditMode);
    view.classList.toggle('hidden', state.guidelineEditMode);

    if (state.guidelineEditMode) {
      hint.classList.add('hidden');
      hint.textContent = '';
      fillGuidelineEditForm();
      return;
    }

    if (!editable && state.taskRole !== 'project_leader') {
      hint.classList.remove('hidden');
      hint.textContent = t('guidelineReadonlyRoleOnly');
      return;
    }
    hint.classList.add('hidden');
    hint.textContent = '';
  }

  function markGuidelineDirty() {
    if (!state.guidelineEditMode) return;
    state.guidelineDirty = true;
  }

  function addGuidelineDraftFiles(role, fileList) {
    var filesKey = role === 'reviewer' ? 'reviewerGuidelineFiles' : 'annotatorGuidelineFiles';
    if (!state.guidelineDraft || !fileList || !fileList.length) return;
    setGuidelineEditError('');
    var allow = ['pdf', 'png', 'jpg', 'jpeg', 'webp', 'md'];
    Array.prototype.forEach.call(fileList, function(file) {
      var type = getGuidelineFileType(file.name);
      if (allow.indexOf(type) === -1) {
        setGuidelineEditError(t('guidelineFileTypeInvalid'));
        return;
      }
      state.guidelineDraft[filesKey].push({ name: file.name, type: type });
      markGuidelineDirty();
    });
    renderGuidelineFileList(role);
  }

  function startGuidelineEdit() {
    if (!isGuidelineEditable()) return;
    state.guidelineEditMode = true;
    state.guidelineDirty = false;
    state.guidelineDraft = createGuidelineDraft();
    renderGuidelineEditState();
    bindGuidelineEditEvents();
    trackEvent('prototype_guideline_edit_started');
  }

  function cancelGuidelineEdit(force) {
    if (!state.guidelineEditMode) return true;
    if (!force && state.guidelineDirty && !window.confirm(t('guidelineLeaveConfirm'))) return false;
    state.guidelineEditMode = false;
    state.guidelineDirty = false;
    state.guidelineDraft = null;
    renderGuidelineEditState();
    return true;
  }

  function saveGuidelineEdit() {
    if (!isGuidelineEditable() || !state.guidelineDraft) return;
    var nextAnnotatorGuidelineText = (state.guidelineDraft.annotatorGuidelineText || '').trim();
    var nextReviewerGuidelineText = (state.guidelineDraft.reviewerGuidelineText || '').trim();
    if (state.lang === 'zh') {
      TASK_DATA.annotatorGuidelineTextZh = nextAnnotatorGuidelineText;
      TASK_DATA.reviewerGuidelineTextZh = nextReviewerGuidelineText;
    } else {
      TASK_DATA.annotatorGuidelineTextEn = nextAnnotatorGuidelineText;
      TASK_DATA.reviewerGuidelineTextEn = nextReviewerGuidelineText;
    }
    TASK_DATA.annotatorGuidelineText = nextAnnotatorGuidelineText;
    TASK_DATA.reviewerGuidelineText = nextReviewerGuidelineText;
    TASK_DATA.annotatorGuidelineFiles = state.guidelineDraft.annotatorGuidelineFiles.map(function(file) {
      return { name: file.name, type: file.type || getGuidelineFileType(file.name) };
    });
    TASK_DATA.reviewerGuidelineFiles = state.guidelineDraft.reviewerGuidelineFiles.map(function(file) {
      return { name: file.name, type: file.type || getGuidelineFileType(file.name) };
    });
    TASK_DATA.guidelineText = nextAnnotatorGuidelineText;
    TASK_DATA.guidelineFiles = TASK_DATA.annotatorGuidelineFiles.map(function(file) {
      return { name: file.name, type: file.type };
    });
    TASK_DATA.forceGuideline = Boolean(state.guidelineDraft.forceGuideline);
    TASK_DATA.guidelineUploaded = hasTaskGuidelineRoleContent('annotator') || hasTaskGuidelineRoleContent('reviewer');
    TASK_DATA.updatedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');
    state.guidelineEditMode = false;
    state.guidelineDirty = false;
    state.guidelineDraft = null;
    showToast(t('guidelineSaveSuccess'));
    renderOverview();
    trackEvent('prototype_guideline_edit_saved');
  }

  function bindGuidelineEditEvents() {
    [
      {
        role: 'annotator',
        uploadZoneId: 'annotatorGuidelineUploadZone',
        inputId: 'editAnnotatorGuidelineFileInput',
        textInputId: 'editAnnotatorGuidelineTextInput',
        textKey: 'annotatorGuidelineText',
      },
      {
        role: 'reviewer',
        uploadZoneId: 'reviewerGuidelineUploadZone',
        inputId: 'editReviewerGuidelineFileInput',
        textInputId: 'editReviewerGuidelineTextInput',
        textKey: 'reviewerGuidelineText',
      }
    ].forEach(function(config) {
      var textInput = document.getElementById(config.textInputId);

      if (textInput && !textInput.dataset.guidelineBound) {
        textInput.addEventListener('input', function(event) {
          if (!state.guidelineDraft) return;
          state.guidelineDraft[config.textKey] = event.target.value;
          markGuidelineDirty();
        });
        textInput.dataset.guidelineBound = 'true';
      }
    });

    var forceToggle = document.getElementById('editForceGuidelineToggle');
    if (forceToggle && !forceToggle.dataset.guidelineBound) {
      forceToggle.addEventListener('change', function(event) {
        if (!state.guidelineDraft) return;
        state.guidelineDraft.forceGuideline = event.target.checked;
        markGuidelineDirty();
      });
      forceToggle.dataset.guidelineBound = 'true';
    }
  }

  window.handleGuidelineUploadZoneClick = function(role) {
    if (!state.guidelineEditMode) return;
    var input = document.getElementById(role === 'reviewer' ? 'editReviewerGuidelineFileInput' : 'editAnnotatorGuidelineFileInput');
    if (input) input.click();
  };

  window.handleGuidelineUploadZoneKeydown = function(event, role) {
    if (!state.guidelineEditMode) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      window.handleGuidelineUploadZoneClick(role);
    }
  };

  window.handleGuidelineFileInputChange = function(role, input) {
    if (!input || !input.files || !input.files.length) return;
    addGuidelineDraftFiles(role, input.files);
    input.value = '';
  };

     Built directly on the shared task-config engine: state.outputConfigs

    renderSettingsEditState();
    trackEvent('prototype_settings_edit_started');

  function cancelSettingsEdit(force) {

    if (!force && state.settingsDirty && !window.confirm(t('settingsLeaveConfirm'))) return false;
    state.settingsEditMode = false;

  function saveSettingsEdit() {
    if (!isSettingsEditable()) return;
    if (state.codeDraftDirty) {
      setSettingsEditError(t('settingsCodeUnsaved'));
      return;

    TASK_DATA.outputs = state.selectedOutputTypes.map(function(outKey) {
      return { type: outKey, config: state.outputConfigs[outKey] || {} };
    });
    if ((state.taskInputTypes && state.taskInputTypes[0]) === 'item_pair') TASK_DATA.itemPairLabels = getItemPairLabels();
    else delete TASK_DATA.itemPairLabels;
    TASK_DATA.updatedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');

    state.settingsEditMode = false;
    state.settingsDirty = false;
    resetTaskConfigSeedGuard();
    showToast(t('settingsSaveSuccess'));
    renderOverview();
    trackEvent('prototype_settings_edit_saved');
  }

  /* Generalization-First: iterates TASK_DATA.outputs[] and the shared
     OUTPUT_TYPE_REGISTRY instead of any per-task-type branch. */
  function getSettingsSummary() {
    var summaryRows = (TASK_DATA.outputs || []).map(function(out) {
      return {
        label: getOutputTypeDisplayLabel(out.type),
        value: summarizeOutputConfigForDisplay(out.type, out.config || {}) || '-',
        required: true,
      };
    });
    return {
      configVersion: TASK_DATA.configVersion || '',
      taskTypeLabel: getTaskTypeLabel(),
      summaryRows: summaryRows,
    };
  }

  function renderSettingsSummaryRows(rows) {
    var container = document.getElementById('settingsConfigDynamicRows');
    if (!container) return;
    container.innerHTML = '';
    (rows || []).forEach(function(row) {
      var rowNode = document.createElement('div');
      rowNode.className = 'kv-dl-row';

      var keyNode = document.createElement('span');
      keyNode.className = 'kv-dl-key';
      keyNode.textContent = row.label;
      if (row.required) {

  function renderMemberPagination(total) {
    var bar = document.getElementById('memberPaginationBar');
    if (!bar) return;

    var totalPages = Math.max(1, Math.ceil(total / state.memberPageSize));
    if (state.memberPage > totalPages) state.memberPage = totalPages;

    var info = document.getElementById('memberPaginationInfo');
    if (info) {
      info.textContent = t('memberPaginationTpl')
        .replace('{total}', total)
        .replace('{page}', state.memberPage)
        .replace('{totalPages}', totalPages);
    }

    var pageSizeSelect = document.getElementById('memberPageSizeSelect');
    if (pageSizeSelect) {
      pageSizeSelect.value = String(state.memberPageSize);
      Array.prototype.forEach.call(pageSizeSelect.options, function(opt) {
        opt.textContent = opt.value + t('memberPageSizeLabel');
      });
    }

    var prevBtn = document.getElementById('memberPrevPageBtn');
    var nextBtn = document.getElementById('memberNextPageBtn');
    if (prevBtn) {
      prevBtn.disabled = state.memberPage <= 1;
      prevBtn.setAttribute('aria-label', t('memberPrevPageAria'));
    }
    if (nextBtn) {
      nextBtn.disabled = state.memberPage >= totalPages;
      nextBtn.setAttribute('aria-label', t('memberNextPageAria'));
    }

    var controls = document.getElementById('memberPaginationControls');
    if (!controls || !nextBtn) return;

    Array.prototype.forEach.call(controls.querySelectorAll('[data-page]'), function(btn) {
      btn.remove();
    });

    var maxVisible = 5;
    var startPage = Math.max(1, state.memberPage - 2);
    var endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    for (var pageNum = startPage; pageNum <= endPage; pageNum++) {
      (function(pg) {
        var btn = document.createElement('button');
        btn.className = 'page-btn' + (pg === state.memberPage ? ' active' : '');
        btn.dataset.page = String(pg);
        btn.type = 'button';
        btn.textContent = String(pg);
        btn.addEventListener('click', function() {
          state.memberPage = pg;
          renderMemberManagement();
        });
        nextBtn.insertAdjacentElement('beforebegin', btn);
      }(pageNum));
    }
  }

  /* Derives a slug-shaped id from an Email local part (issue #688), for the
     rare case a TASK_MEMBERS record needs an id but has no canonical
     PLATFORM_USERS entry to look one up from -- e.g. an invited-by-Email
     member who was never a platform user. Not a substitute for the
     PLATFORM_USERS lookup: it produces a fresh id with no history, so it is
     only a fallback. */
  function deriveUserIdFromEmail(email) {
    var localPart = String(email || '').split('@')[0].toLowerCase();
    return 'user_' + localPart.replace(/[^a-z0-9]/g, '_');
  }

  function getAvailablePlatformUsers(query) {
    var needle = String(query || '').trim().toLowerCase();
    if (!needle) return [];
    return PLATFORM_USERS.filter(function(user) {
      var inTask = TASK_MEMBERS.some(function(member) { return member.email === user.email; });
      if (inTask) return false;
      return [user.account, user.name, user.email].some(function(value) {
        return String(value || '').toLowerCase().indexOf(needle) >= 0;
      });
    });
  }

  function addPlatformUserToTask(user, role) {
    if (!user || TASK_MEMBERS.some(function(member) { return member.email === user.email; })) return;
    TASK_MEMBERS.push({
      id: user.id || deriveUserIdFromEmail(user.email),
      name: user.name,
      email: user.email,
      taskRole: role,
      status: 'active',
      joinedAt: '2026-04-21 10:25',
      lastActive: '-',
    });
    user.activeTaskCount = (user.activeTaskCount || 0) + 1;
    showToast(t('toastMemberUpdated'));
    trackEvent('prototype_member_added', { member_email: user.email, role: role, source: 'platform_search' });
    renderMemberManagement();
  }

  function inviteMemberByEmail() {
    if (state.taskRole !== 'project_leader') {
      showToast(t('errPermissionDenied'), true);
      return;
    }
    var input = document.getElementById('memberInviteEmailInput');
    var roleSelect = document.getElementById('memberInviteRoleSelect');
    if (!input || !roleSelect) return;
    var email = String(input.value || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showToast(t('errMemberInviteEmail'), true);
      return;
    }
    if (TASK_MEMBERS.some(function(member) { return String(member.email || '').toLowerCase() === email; })) {
      showToast(t('errMemberDuplicate'), true);
      return;
    }
    /* This invited-member path is currently unreachable: invited status
       (:6890 `if (member.status !== 'invited') return;`) has no
       invited -> active transition anywhere in this file, so no test
       exercises it. `id` is still added here so the TASK_MEMBERS "every
       record has an id" invariant holds regardless of push site -- leaving
       one push without it would let the invariant rot again the moment this
       path becomes reachable. */
    TASK_MEMBERS.push({
      id: deriveUserIdFromEmail(email),
      name: email,
      email: email,
      taskRole: roleSelect.value,
      status: 'invited',
      joinedAt: '2026-04-21 10:30',
      lastActive: '-',
    });

    trackEvent('prototype_member_added', { member_email: email, role: roleSelect.value, source: 'email_invite' });

  function executeMemberAction() {
    var action = state.pendingMemberAction;
    if (!action) return;
    var target = TASK_MEMBERS[action.index];
    if (!target) {
      closeMemberActionModal();
      return;
    }

    if (action.type === 'remove') {
      createUnassignedAssignmentsForRemovedMember(target);
      releaseReviewerPendingLoad(target);
      TASK_MEMBERS.splice(action.index, 1);
    } else if (action.type === 'disable') {
      target.status = 'disabled';
      releaseReviewerPendingLoad(target);
    } else if (action.type === 'enable') {
      target.status = 'active';
    }
    showToast(t('toastMemberUpdated'));
    trackEvent('prototype_member_action_confirmed', { action_type: action.type, member_email: target.email || '' });
    closeMemberActionModal();
    renderMemberManagement();
    renderAnnotationProgress();
    /* Membership changes feed the review-settings arbiter pool; refresh its
       summary so stale arbiter counts never survive a tab switch back. */
    renderReviewEditState();
  }

  function getReviewWorkload(id) {
    var byReviewer = REVIEW_WORKLOAD.byReviewer;
    if (!byReviewer[id]) byReviewer[id] = { pending: 0, done: 0 };
    return byReviewer[id];
  }

  function formatReviewLoad(id) {
    var load = getReviewWorkload(id);
    return interpolate(t('reviewLoadTpl'), { assigned: load.pending + load.done, pending: load.pending });
  }

  /* Removing or disabling a reviewer must not orphan their in-flight review
     units: pending flows back to the unassigned pool, done stays as
     historical stats (mirrors FR-005f for annotators). */
  function releaseReviewerPendingLoad(member) {
    var load = REVIEW_WORKLOAD.byReviewer[member.id];
    if (!load || !load.pending) return;
    REVIEW_WORKLOAD.unassignedCount += load.pending;
    load.pending = 0;
  }

  /* FR-005j / FR-005k: review_assignment_mode and arbitration_enabled are
     retired -- assignment is always system-automatic and both pool rows are
     always read-only info rows, so this block no longer branches on an
     "actionable" mode. */
  function renderReviewAssignment() {

    setText('exceptionPoolText', interpolate(t('exceptionPoolTpl'), { count: REVIEW_WORKLOAD.exceptionCount || 0 }));

    while (body.firstChild) body.removeChild(body.firstChild);
    getActiveReviewerMembers().forEach(function(member) {

      var tdName = document.createElement('td');

      }

        var td = document.createElement('td');

      });

      body.appendChild(tr);
    });

  function getProgressStageData() {
    if (state.progressStage === 'official') return ANNOTATION_PROGRESS.official;
    var found = ANNOTATION_PROGRESS.rounds.filter(function(r) { return r.id === state.progressStage; });
    return found.length ? found[0] : ANNOTATION_PROGRESS.rounds[ANNOTATION_PROGRESS.rounds.length - 1];
  }

  function getActiveAnnotatorMembers() {
    return TASK_MEMBERS.filter(function(member) {
      return member.taskRole === 'annotator' && member.status === 'active';
    });
  }

  /* FR-010t / SC-038 (issue #189 decision D3, issue #505; roster model per
     issue #596): publishing a trial round or the official run must be
     blocked per-role whenever the count of active members falls short --
     annotators are checked against min_annotators, reviewers are checked
     against the fixed threshold of 1 active member inside reviewer_ids
     (min_reviewers is retired: a review unit always has exactly one
     reviewer). Returns one interpolated "還差 N 位" message per short-handed
     role so canPublish() can surface every gap at once. */
  function getMembershipGapMessages() {
    var messages = [];
    var annotatorGap = Number(TASK_DATA.minAnnotators) - getActiveAnnotatorMembers().length;
    if (annotatorGap > 0) {
      messages.push(interpolate(t('memberGapAnnotatorTpl'), { count: annotatorGap }));
    }
    var reviewerGap = 1 - getEffectiveReviewerIds(TASK_DATA.reviewerIds).length;
    if (reviewerGap > 0) {
      messages.push(interpolate(t('memberGapReviewerTpl'), { count: reviewerGap }));
    }
    return messages;
  }

  function getAssignmentCount(records, roundId) {
    return records
      .filter(function(item) { return !roundId || item.roundId === roundId; })
      .reduce(function(sum, item) { return sum + item.sampleIds.length; }, 0);
  }

  function getUnassignedForStage(stageId) {
    return UNASSIGNED_ANNOTATION_ASSIGNMENTS.filter(function(item) {
      return item.roundId === stageId;
    });
  }

  function getExcludedForStage(stageId) {
    return EXCLUDED_ANNOTATION_ASSIGNMENTS.filter(function(item) {
      return item.roundId === stageId;
    });
  }

  function getProgressMemberByName(stageData, name) {
    return (stageData.members || []).filter(function(member) {
      return member.name === name;
    })[0] || null;
  }

  function getProgressMemberByEmail(stageData, email) {
    var member = TASK_MEMBERS.filter(function(item) { return item.email === email; })[0];
    return member ? getProgressMemberByName(stageData, member.name) : null;
  }

  function createUnassignedAssignmentsForRemovedMember(target) {
    ANNOTATION_PROGRESS.rounds.forEach(function(round) {
      var progressMember = getProgressMemberByName(round, target.name);
      if (!progressMember || progressMember.pending <= 0) return;
      var sampleIds = [];
      for (var i = 1; i <= progressMember.pending; i++) {
        sampleIds.push('R' + round.roundNum + '-UNASSIGNED-' + String(i).padStart(3, '0'));
      }
      UNASSIGNED_ANNOTATION_ASSIGNMENTS.push({
        assignmentId: 'unassigned-' + round.id + '-' + getAnnotatorId(target.email) + '-' + Date.now(),
        stage: 'dry',
        roundId: round.id,
        roundNum: round.roundNum,
        sampleIds: sampleIds,
        sourceMemberName: target.name,
        sourceMemberEmail: target.email,
        reasonKey: 'unassignedFromRemovedMember',
        createdAt: new Date().toISOString().slice(0, 16).replace('T', ' ')
      });
      progressMember.pending = 0;
    });
    var officialMember = getProgressMemberByName(ANNOTATION_PROGRESS.official, target.name);
    if (officialMember && officialMember.pending > 0) {
      var officialSampleIds = [];
      for (var j = 1; j <= officialMember.pending; j++) {
        officialSampleIds.push('OFFICIAL-UNASSIGNED-' + String(j).padStart(3, '0'));
      }
      UNASSIGNED_ANNOTATION_ASSIGNMENTS.push({
        assignmentId: 'unassigned-official-' + getAnnotatorId(target.email) + '-' + Date.now(),
        stage: 'official',
        roundId: 'official',
        roundNum: null,
        sampleIds: officialSampleIds,
        sourceMemberName: target.name,
        sourceMemberEmail: target.email,
        reasonKey: 'unassignedFromRemovedMember',
        createdAt: new Date().toISOString().slice(0, 16).replace('T', ' ')
      });
      officialMember.pending = 0;
    }
  }

  function getExcludedExportMetadata(stage) {
    var records = EXCLUDED_ANNOTATION_ASSIGNMENTS.filter(function(item) {
      return stage === 'all' || item.stage === stage || item.roundId === stage;
    });
    return records.map(function(item) {
      return {
        assignment_id: item.assignmentId,
        run_stage: item.stage,
        trial_round: item.stage === 'dry' ? item.roundNum : null,
        sample_ids: item.sampleIds.slice(),
        sample_count: item.sampleIds.length,
        excluded_by: item.excludedBy || getExportedById(),
        excluded_at: item.excludedAt || null,
        reason: item.reason || t('excludedMetadataReason'),
        source_member_email: item.sourceMemberEmail || null
      };
    });
  }

  function getProgressRate(completed, total) {
    if (!total) return 0;
    return Math.max(0, Math.min(100, Math.round((completed / total) * 100)));
  }

  function getQualityLabel(quality) {
    if (quality === 'risk') return t('qualityRisk');
    if (quality === 'watch') return t('qualityWatch');
    return t('qualityGood');
  }

  function getQualityClass(quality) {
    if (quality === 'risk') return 'quality-flag quality-risk';
    if (quality === 'watch') return 'quality-flag quality-watch';
    return 'quality-flag quality-good';
  }

  function formatProgressSpeed(speed) {
    return speed > 0 ? speed.toFixed(1) + ' ' + t('progressSpeedUnit') : '-';
  }

  function getSortedProgressMembers(members) {
    var cloned = members.slice();
    if (state.progressSort === 'speed_desc') {
      cloned.sort(function(a, b) { return b.avgSpeed - a.avgSpeed; });
      return cloned;
    }
    if (state.progressSort === 'submitted_desc') {
      cloned.sort(function(a, b) { return Date.parse(b.lastSubmitted) - Date.parse(a.lastSubmitted); });
      return cloned;
    }
    cloned.sort(function(a, b) { return b.completed - a.completed; });
    return cloned;
  }

  function renderProgressRoundPills() {
    var container = document.getElementById('progressRoundPills');
    if (!container) return;
    while (container.firstChild) container.removeChild(container.firstChild);

    ANNOTATION_PROGRESS.rounds.forEach(function(round) {
      var btn = document.createElement('button');
      btn.className = 'stage-btn' + (state.progressStage === round.id ? ' active' : '');
      btn.type = 'button';
      var label = 'R' + round.roundNum;
      if (round.status === 'active') {
        label += state.lang === 'zh' ? ' · 進行中' : ' · Active';
      } else if (round.result === 'passed') {
        label += ' ✓';
      } else if (round.result === 'failed') {
        label += ' ✗';
      }
      btn.textContent = label;
      btn.addEventListener('click', function() {
        state.progressStage = round.id;
        renderAnnotationProgress();
      });
      container.appendChild(btn);
    });

    var officialBtn = document.createElement('button');
    officialBtn.className = 'stage-btn' + (state.progressStage === 'official' ? ' active' : '');
    officialBtn.type = 'button';
    officialBtn.textContent = t('stageOfficialTitle');
    officialBtn.addEventListener('click', function() {
      state.progressStage = 'official';
      renderAnnotationProgress();
    });
    container.appendChild(officialBtn);
  }

  function renderProgressSummary() {
    var stageData = getProgressStageData();
    var unassignedCount = getAssignmentCount(getUnassignedForStage(state.progressStage));
    var excludedCount = getAssignmentCount(getExcludedForStage(state.progressStage));
    var effectiveTotal = Math.max(0, stageData.totalSamples - excludedCount);
    var rate = getProgressRate(stageData.completedSamples, effectiveTotal);
    var rateText = rate + '%';
    if (unassignedCount || excludedCount) {
      rateText += t('unassignedRateSuffixTpl')
        .replace('{unassigned}', unassignedCount)
        .replace('{excluded}', excludedCount);
    }

    setText('progressMetricTotalValue', String(effectiveTotal));
    setText('progressMetricCompletedValue', String(stageData.completedSamples));
    setText('progressMetricRateValue', rateText);
    setText('progressMetricSpeedValue', formatProgressSpeed(stageData.avgSpeed));
    setText('progressMetricEtaValue', state.lang === 'zh' ? stageData.remainingEta : stageData.remainingEtaEn);
    setText('progressMetricIAAValue', (state.progressStage !== 'official' && unassignedCount) ? t('unassignedIaaBlocked') : (stageData.iaa != null ? stageData.iaa.toFixed(2) : '-'));
  }

      tr.appendChild(tdWithText(String(member.completed)));

  function removeUnassignedAssignment(assignmentId) {
    var found = null;
    UNASSIGNED_ANNOTATION_ASSIGNMENTS = UNASSIGNED_ANNOTATION_ASSIGNMENTS.filter(function(item) {
      if (item.assignmentId === assignmentId) {
        found = item;
        return false;
      }
      return true;
    });
    return found;
  }

  function reassignAnnotationAssignment(assignmentId, memberEmail) {
    var item = removeUnassignedAssignment(assignmentId);
    if (!item) return;
    var stageData = item.stage === 'official'
      ? ANNOTATION_PROGRESS.official
      : ANNOTATION_PROGRESS.rounds.filter(function(round) { return round.id === item.roundId; })[0];
    if (!stageData) return;
    var target = getProgressMemberByEmail(stageData, memberEmail);
    if (!target) {
      var member = TASK_MEMBERS.filter(function(item) { return item.email === memberEmail; })[0];
      if (member) {
        target = {
          name: member.name,
          role: 'annotator',
          completed: 0,
          pending: 0,
          avgSpeed: 0,
          lastSubmitted: '-',
          quality: 'good'
        };
        stageData.members.push(target);
      }
    }
    if (target) {
      target.pending += item.sampleIds.length;
    }
    showToast(t('toastMemberUpdated'));
    renderAnnotationProgress();
  }

  function excludeAnnotationAssignment(assignmentId) {
    var item = removeUnassignedAssignment(assignmentId);
    if (!item) return;
    item.excludedBy = getExportedById();
    item.excludedAt = new Date().toISOString();
    item.reason = t('excludedMetadataReason');
    EXCLUDED_ANNOTATION_ASSIGNMENTS.push(item);
    showToast(t('toastMemberUpdated'));
    renderAnnotationProgress();
  }

  function renderMemberAnnotationDetail(memberName) {
    var section = document.getElementById('memberDetailSection');
    var titleEl = document.getElementById('memberDetailTitle');
    if (!section || !titleEl) return;

    titleEl.textContent = memberName + (state.lang === 'zh' ? ' 的標記細項' : "'s annotation details");

    var taskResults = getAnnotationResultsData();
    var taskMap = MEMBER_ANNOTATOR_MAP[TASK_DATA.taskId] || {};
    var annotatorId = taskMap[memberName];

    state.mdRows = [];
    if (!annotatorId) {
      state.mdPage = 1;
      renderMdDetailPage();
      section.classList.remove('hidden');
      section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    taskResults.forEach(function(sample) {
      (sample.annotations || []).forEach(function(ann) {
        if (ann.annotator !== annotatorId) return;
        state.mdRows.push({ sample: sample, ann: ann });
      });
    });

    state.mdPage = 1;
    renderMdDetailPage();

    section.classList.remove('hidden');
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderMdDetailPage() {
    var tbody = document.getElementById('memberDetailTableBody');
    var emptyEl = document.getElementById('memberDetailEmpty');
    if (!tbody) return;

    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

    var total = state.mdRows.length;
    var totalPages = Math.max(1, Math.ceil(total / state.mdPageSize));
    if (state.mdPage > totalPages) state.mdPage = totalPages;
    var pageRows = state.mdRows.slice((state.mdPage - 1) * state.mdPageSize, state.mdPage * state.mdPageSize);

    emptyEl.classList.toggle('hidden', total > 0);
    document.getElementById('memberDetailTable').classList.toggle('hidden', total === 0);

    pageRows.forEach(function(row) {
      var sample = row.sample;
      var ann = row.ann;
      var tr = document.createElement('tr');

      var tdId = document.createElement('td');
      tdId.className = 'md-id-cell';
      tdId.textContent = sample.sampleId;
      tr.appendChild(tdId);

      var tdText = document.createElement('td');
      tdText.className = 'md-text-cell';
      tdText.textContent = state.lang === 'zh' ? sample.textZh : (sample.textEn || sample.textZh);
      tr.appendChild(tdText);

      var tdResult = document.createElement('td');
      if (ann.value && ann.value.labels) {
        var chips = document.createElement('div');
        chips.className = 'md-chips';
        ann.value.labels.forEach(function(lbl) {
          var chip = document.createElement('span');
          chip.className = 'md-chip';
          chip.textContent = lbl;
          chips.appendChild(chip);
        });
        tdResult.appendChild(chips);
      } else if (ann.value && ann.value.valence !== undefined) {
        tdResult.textContent = 'V:' + ann.value.valence + ' A:' + ann.value.arousal;
        tdResult.style.fontFamily = 'var(--font-mono)';
        tdResult.style.fontSize = '12px';
      } else {
        tdResult.textContent = '-';
        tdResult.style.color = 'var(--color-text-soft)';
      }
      tr.appendChild(tdResult);

      var tdTime = document.createElement('td');
      tdTime.className = 'md-time-cell';
      tdTime.textContent = ann.submittedAt || '-';
      tr.appendChild(tdTime);

      var tdStatus = document.createElement('td');
      var statusBadge = document.createElement('span');
      var reviewBadge = getArReviewBadge(ann.reviewStatus);
      statusBadge.className = 'ar-review-badge ' + reviewBadge.cls;
      statusBadge.textContent = reviewBadge.label;
      tdStatus.appendChild(statusBadge);
      tr.appendChild(tdStatus);

      tbody.appendChild(tr);
    });

    renderMdPagination(total);
  }

  function renderMdPagination(total) {
    var bar = document.getElementById('mdPaginationBar');
    if (!bar) return;

    var totalPages = Math.max(1, Math.ceil(total / state.mdPageSize));
    if (state.mdPage > totalPages) state.mdPage = totalPages;

    bar.classList.toggle('hidden', total === 0);

    var info = document.getElementById('mdPaginationInfo');
    if (info) {
      info.textContent = interpolate(t('mdPaginationTpl'), {
        total: total,
        page: state.mdPage,
        totalPages: totalPages
      });
    }

    var pageSizeSelect = document.getElementById('mdPageSizeSelect');
    if (pageSizeSelect) {
      pageSizeSelect.value = String(state.mdPageSize);
      Array.prototype.forEach.call(pageSizeSelect.options, function(opt) {
        opt.textContent = opt.value + t('mdPageSizeLabel');
      });
    }

    var prevBtn = document.getElementById('mdPrevPageBtn');
    var nextBtn = document.getElementById('mdNextPageBtn');
    if (prevBtn) {
      prevBtn.disabled = state.mdPage <= 1;
      prevBtn.setAttribute('aria-label', t('mdPrevPageAria'));
    }
    if (nextBtn) {
      nextBtn.disabled = state.mdPage >= totalPages;
      nextBtn.setAttribute('aria-label', t('mdNextPageAria'));
    }

    var controls = document.getElementById('mdPaginationControls');
    if (!controls || !nextBtn) return;

    Array.prototype.forEach.call(controls.querySelectorAll('[data-page]'), function(btn) {
      btn.remove();
    });

    var maxVisible = 5;
    var startPage = Math.max(1, state.mdPage - 2);
    var endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    for (var pageNum = startPage; pageNum <= endPage; pageNum++) {
      (function(pg) {
        var btn = document.createElement('button');
        btn.className = 'page-btn' + (pg === state.mdPage ? ' active' : '');
        btn.dataset.page = String(pg);
        btn.type = 'button';
        btn.textContent = String(pg);
        btn.addEventListener('click', function() {
          state.mdPage = pg;
          renderMdDetailPage();
        });
        nextBtn.insertAdjacentElement('beforebegin', btn);
      }(pageNum));
    }
  }

  function renderRoundProgressList() {
    var container = document.getElementById('roundProgressList');
    if (!container) return;
    while (container.firstChild) container.removeChild(container.firstChild);

    function makePhaseItem(roundLabel, statusTagClass, statusTagText, fillClass, fillWidth, iaaText, metaText, itemClass) {
      var item = document.createElement('div');
      item.className = 'phase-item' + (itemClass ? ' ' + itemClass : '');

      var head = document.createElement('div');
      head.className = 'phase-item-head';

      var label = document.createElement('span');
      label.className = 'phase-round-label';
      label.textContent = roundLabel;
      head.appendChild(label);

      var tag = document.createElement('span');
      tag.className = 'phase-status-tag ' + statusTagClass;
      tag.textContent = statusTagText;
      head.appendChild(tag);

      if (iaaText) {
        var iaa = document.createElement('span');
        iaa.className = 'phase-iaa-text';
        iaa.textContent = iaaText;
        head.appendChild(iaa);
      }
      item.appendChild(head);

      var track = document.createElement('div');
      track.className = 'stage-split-track';
      track.setAttribute('aria-hidden', 'true');
      var fill = document.createElement('div');
      fill.className = 'stage-split-fill ' + fillClass;
      fill.style.width = fillWidth + '%';
      track.appendChild(fill);
      item.appendChild(track);

      var meta = document.createElement('p');
      meta.className = 'phase-meta';
      meta.textContent = metaText;
      item.appendChild(meta);

      return item;
    }

    var stageData = getProgressStageData();
    var roundEffectiveTotal = Math.max(0, stageData.totalSamples - getAssignmentCount(getExcludedForStage(state.progressStage)));
    var rate = getProgressRate(stageData.completedSamples, roundEffectiveTotal);
    var isOfficial = state.progressStage === 'official';
    var roundLabel, statusTagClass, statusTagText, fillClass, itemClass;

    if (isOfficial) {
      roundLabel = t('stageOfficialTitle');
      fillClass = 'official';
      statusTagClass = stageData.status === 'active' ? 'phase-status-tag--active' : 'phase-status-tag--pending';
      statusTagText = stageData.status === 'active' ? t('phaseStatusActive') : t('phaseStatusPending');
      itemClass = stageData.status === 'active' ? 'phase-item--active' : 'phase-item--pending';
    } else {
      roundLabel = 'R' + stageData.roundNum;
      fillClass = 'dry';
      if (stageData.status === 'active') {
        statusTagClass = 'phase-status-tag--active';
        statusTagText = t('phaseStatusActive');
        itemClass = 'phase-item--active';
      } else if (stageData.result === 'passed') {
        statusTagClass = 'phase-status-tag--passed';
        statusTagText = t('phaseStatusPassed');
        itemClass = '';
      } else {
        statusTagClass = 'phase-status-tag--failed';
        statusTagText = t('phaseStatusFailed');
        itemClass = '';
      }
    }

    var meta = interpolate(t('progressStageMetaTpl'), { completed: stageData.completedSamples, total: roundEffectiveTotal, rate: rate });
    container.appendChild(makePhaseItem(roundLabel, statusTagClass, statusTagText, fillClass, rate, null, meta, itemClass));
  }

  /* FR-018 point 3: the resolve link carries the full review-unit identity
     (task_id x run_type x annotator_id x sample_id) into the FR-095
     disposal screen (annotation-workspace.html), the same URL shape
     annotation-list.html's buildWorkspaceUrl() uses for the reviewer path --
     role=project_leader is the resolver identity resolveExceptionPoolItem()
     already assumes (DEFAULT_PROJECT_LEADER_ID). */
  function buildFinalExceptionPoolResolveUrl(item) {
    return '../annotation/annotation-workspace.html' +
      '?task_id=' + encodeURIComponent(item.taskId) +
      '&sample_id=' + encodeURIComponent(item.sampleId) +
      '&role=project_leader' +
      '&run_type=' + encodeURIComponent(item.runType) +
      '&annotator_id=' + encodeURIComponent(item.annotatorId);
  }

     the rows themselves are derived by task-detail.data.js's
     getFinalExceptionPoolItems() straight off 015's dispute/arbitration
     state (design.md D6). run_type follows the same round-selector state
     the rest of this panel already uses (state.progressStage), so switching
     the existing dry/official pills also re-scopes the pool (FR-018 point
     5) without a second, independent filter control. */

  function getWorkLogStageLabel(stage) {
    return stage === 'official' ? t('workLogStageOfficial') : t('workLogStageDry');
  }

  function getWorkLogStageBadgeClass(stage) {
    return stage === 'official' ? 'badge-run-official' : 'badge-run-dry';
  }

  function getCurrentUserEmail() {
    return ROLE_SELF_EMAIL[state.taskRole] || ROLE_SELF_EMAIL.project_leader;
  }

  function getFilteredWorkLogEntries() {
    return WORK_LOG_ENTRIES.filter(function(entry) {
      if (state.workLogDateFrom && entry.date < state.workLogDateFrom) return false;
      if (state.workLogDateTo && entry.date > state.workLogDateTo) return false;
      if (state.workLogStage !== 'all' && entry.stage !== state.workLogStage) return false;

      if (state.taskRole === 'reviewer') {
        return entry.memberEmail === getCurrentUserEmail();
      }
      if (state.workLogMember !== 'all' && entry.memberEmail !== state.workLogMember) {
        return false;
      }
      return true;
    });
  }

  function formatWorkLogDuration(hours) {
    var totalMinutes = Math.round(hours * 60);
    var durationHours = Math.floor(totalMinutes / 60);
    var durationMinutes = totalMinutes % 60;
    return interpolate(t('workLogDurationTpl'), { hours: durationHours, minutes: durationMinutes });
  }

  function getOnlineDurationMinutes(entry) {
    if (!entry.loginAt || !entry.logoutAt) return 0;
    var login = entry.loginAt.split(':').map(Number);
    var logout = entry.logoutAt.split(':').map(Number);
    if (login.length < 2 || logout.length < 2) return 0;
    return Math.max(0, ((logout[0] * 60) + logout[1]) - ((login[0] * 60) + login[1]));
  }

  function formatWorkLogLoginLogout(entry) {
    return (entry.loginAt || '--:--') + ' / ' + (entry.logoutAt || '--:--');
  }

  function formatWorkLogOnlineDuration(entry) {
    var totalMinutes = getOnlineDurationMinutes(entry);
    var hours = Math.floor(totalMinutes / 60);
    var minutes = totalMinutes % 60;
    return interpolate(t('workLogOnlineDurationTpl'), { hours: hours, minutes: minutes });
  }

  function getWorkLogEntryTotal(entry) {
    return (entry.annotatedCount || 0) + (entry.reviewedCount || 0) + (entry.arbitratedCount || 0);
  }

  function formatWorkLogCount(count) {
    return count === null || count === undefined ? '—' : String(count);
  }

  function formatWorkLogSpeedByEntry(entry) {
    var speed = entry.durationHours > 0 ? getWorkLogEntryTotal(entry) / entry.durationHours : 0;
    return speed.toFixed(1) + ' ' + t('workLogSpeedUnit');
  }

  function getTaskRoleByEmail(email) {
    var target = TASK_MEMBERS.find(function(member) { return member.email === email; });
    return target && target.taskRole ? target.taskRole : 'annotator';
  }

  function renderWorkLogMemberOptions() {
    var memberWrap = document.getElementById('workLogMemberFilterWrap');
    var memberSelect = document.getElementById('workLogMemberSelect');
    if (!memberWrap || !memberSelect) return;

    memberWrap.classList.toggle('hidden', state.taskRole !== 'project_leader');
    if (state.taskRole !== 'project_leader') {
      state.workLogMember = 'all';
      return;
    }

    while (memberSelect.firstChild) memberSelect.removeChild(memberSelect.firstChild);

    var defaultOpt = document.createElement('option');
    defaultOpt.value = 'all';
    defaultOpt.textContent = t('workLogMemberAll');
    memberSelect.appendChild(defaultOpt);

    TASK_MEMBERS.forEach(function(member) {
      var opt = document.createElement('option');
      opt.value = member.email;
      opt.textContent = member.name;
      memberSelect.appendChild(opt);
    });

    var hasSelected = TASK_MEMBERS.some(function(member) { return member.email === state.workLogMember; });
    if (state.workLogMember !== 'all' && !hasSelected) {
      state.workLogMember = 'all';
    }
    memberSelect.value = state.workLogMember;
  }

  function renderWorkLogTable(entries) {
    var tbody = document.getElementById('workLogTableBody');
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

    entries.forEach(function(entry) {
      var tr = document.createElement('tr');

      function td(text, cls) {
        var node = document.createElement('td');
        if (cls) node.className = cls;
        node.textContent = text;
        return node;
      }

      tr.appendChild(td(entry.date));
      tr.appendChild(td(entry.memberName, 'member-name'));

      var tdRole = document.createElement('td');
      var roleBadge = document.createElement('span');
      var role = getTaskRoleByEmail(entry.memberEmail);
      roleBadge.className = getTaskRoleBadgeClass(role);
      roleBadge.textContent = getTaskRoleLabel(role);
      tdRole.appendChild(roleBadge);
      tr.appendChild(tdRole);

      tr.appendChild(td(formatWorkLogLoginLogout(entry)));
      tr.appendChild(td(formatWorkLogOnlineDuration(entry)));
      tr.appendChild(td(formatWorkLogDuration(entry.durationHours)));
      tr.appendChild(td(formatWorkLogCount(entry.annotatedCount)));
      tr.appendChild(td(formatWorkLogCount(entry.reviewedCount)));
      tr.appendChild(td(formatWorkLogCount(entry.arbitratedCount)));
      tr.appendChild(td(formatWorkLogSpeedByEntry(entry)));

      var tdStage = document.createElement('td');
      var stageBadge = document.createElement('span');
      stageBadge.className = 'badge ' + getWorkLogStageBadgeClass(entry.stage);
      stageBadge.textContent = getWorkLogStageLabel(entry.stage);
      tdStage.appendChild(stageBadge);
      tr.appendChild(tdStage);
      tbody.appendChild(tr);
    });
  }

  function renderWorkLogSummary(entries) {
    var totalHours = entries.reduce(function(sum, entry) { return sum + entry.durationHours; }, 0);
    var totalAnnotated = entries.reduce(function(sum, entry) { return sum + (entry.annotatedCount || 0); }, 0);
    var totalReviewed = entries.reduce(function(sum, entry) { return sum + (entry.reviewedCount || 0); }, 0);
    var totalItems = entries.reduce(function(sum, entry) { return sum + getWorkLogEntryTotal(entry); }, 0);
    var weightedSpeed = totalHours > 0 ? totalItems / totalHours : 0;
    var avgMinutesPerItem = totalItems > 0 ? (totalHours * 60) / totalItems : 0;

    setText('workLogSummaryHoursValue', formatWorkLogDuration(totalHours));
    setText('workLogSummaryAnnotatedValue', String(totalAnnotated));
    setText('workLogSummaryReviewedValue', String(totalReviewed));
    setText(
      'workLogSummarySpeedValue',
      (weightedSpeed > 0 ? weightedSpeed.toFixed(1) : '0.0') + ' ' + t('workLogSpeedUnit')
    );
    setText(
      'workLogSummaryAvgPerItemValue',
      totalItems > 0 ? interpolate(t('workLogSummaryAvgPerItemTpl'), { minutes: avgMinutesPerItem.toFixed(1) }) : ''
    );
  }

  function renderWorkLogAlerts(entries) {
    var list = document.getElementById('workLogAlertList');
    while (list.firstChild) list.removeChild(list.firstChild);

    var anomalies = entries.filter(function(entry) {
      var speed = entry.durationHours > 0 ? getWorkLogEntryTotal(entry) / entry.durationHours : 0;
      return speed > 24 || speed < 9;
    });

    if (!anomalies.length) {
      var none = document.createElement('li');
      none.className = 'status-hint';
      none.textContent = t('workLogAlertNone');
      list.appendChild(none);
      return;
    }

    anomalies.forEach(function(entry) {
      var speed = entry.durationHours > 0 ? getWorkLogEntryTotal(entry) / entry.durationHours : 0;
      var li = document.createElement('li');
      li.className = 'anomaly-item';

      var icon = document.createElement('img');
      icon.src = '../../assets/icons/alert-circle.svg';
      icon.alt = '';
      icon.setAttribute('aria-hidden', 'true');
      li.appendChild(icon);

      var message = speed > 24 ? t('workLogAnomalyFast') : t('workLogAnomalySlow');
      li.appendChild(document.createTextNode(interpolate(message, {
        date: entry.date,
        member: entry.memberName,
        speed: speed.toFixed(1) + ' ' + t('workLogSpeedUnit'),
      })));
      list.appendChild(li);
    });
  }

  function renderWorkLogEmptyState(entries) {
    var empty = !entries.length;
    document.getElementById('workLogEmptyState').classList.toggle('hidden', !empty);
    document.getElementById('workLogTableSection').classList.toggle('hidden', empty);
    document.getElementById('workLogAlertSection').classList.toggle('hidden', empty);
  }

  function renderWorkLogPagination(total) {
    var bar = document.getElementById('wlPaginationBar');
    if (!bar) return;

    var totalPages = Math.max(1, Math.ceil(total / state.wlPageSize));
    if (state.wlPage > totalPages) state.wlPage = totalPages;

    bar.classList.toggle('hidden', total === 0);

    var info = document.getElementById('wlPaginationInfo');
    if (info) {
      info.textContent = t('wlPaginationTpl')
        .replace('{total}', total)
        .replace('{page}', state.wlPage)
        .replace('{totalPages}', totalPages);
    }

    var pageSizeSelect = document.getElementById('wlPageSizeSelect');
    if (pageSizeSelect) {
      pageSizeSelect.value = String(state.wlPageSize);
      Array.prototype.forEach.call(pageSizeSelect.options, function(opt) {
        opt.textContent = opt.value + t('wlPageSizeLabel');
      });
    }

    var prevBtn = document.getElementById('wlPrevPageBtn');
    var nextBtn = document.getElementById('wlNextPageBtn');
    if (prevBtn) {
      prevBtn.disabled = state.wlPage <= 1;
      prevBtn.setAttribute('aria-label', t('wlPrevPageAria'));
    }
    if (nextBtn) {
      nextBtn.disabled = state.wlPage >= totalPages;
      nextBtn.setAttribute('aria-label', t('wlNextPageAria'));
    }

    var controls = document.getElementById('wlPaginationControls');
    if (!controls || !nextBtn) return;

    Array.prototype.forEach.call(controls.querySelectorAll('[data-page]'), function(btn) {
      btn.remove();
    });

    var maxVisible = 5;
    var startPage = Math.max(1, state.wlPage - 2);
    var endPage = Math.min(totalPages, startPage + maxVisible - 1);
    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    for (var pageNum = startPage; pageNum <= endPage; pageNum++) {
      (function(pg) {
        var btn = document.createElement('button');
        btn.className = 'page-btn' + (pg === state.wlPage ? ' active' : '');
        btn.dataset.page = String(pg);
        btn.type = 'button';
        btn.textContent = String(pg);
        btn.addEventListener('click', function() {
          state.wlPage = pg;
          renderWorkLog();
        });
        nextBtn.insertAdjacentElement('beforebegin', btn);
      }(pageNum));
    }
  }

  function renderWorkLog() {
    document.getElementById('workLogDateFrom').value = state.workLogDateFrom;
    document.getElementById('workLogDateTo').value = state.workLogDateTo;
    updateWorkLogDatePlaceholderState(document.getElementById('workLogDateFrom'));
    updateWorkLogDatePlaceholderState(document.getElementById('workLogDateTo'));
    document.getElementById('workLogStageSelect').value = state.workLogStage;
    renderWorkLogMemberOptions();
    var entries = getFilteredWorkLogEntries();
    var startIndex = (state.wlPage - 1) * state.wlPageSize;
    var pageEntries = entries.slice(startIndex, startIndex + state.wlPageSize);
    renderWorkLogTable(pageEntries);
    renderWorkLogSummary(entries);
    renderWorkLogAlerts(entries);
    renderWorkLogEmptyState(entries);
    renderWorkLogPagination(entries.length);
  }

  /* Issue #284: a task_id with no ANNOTATION_RESULTS_BY_TASK entry (e.g. a
     seeded task like T014-T017 that was never added to the mock table, or a
     real task created during a journey) used to silently fall back to
     T001's seed results here and in export. Return an empty set instead so
     renderAnnotationResults() shows the existing arEmptyState empty state
     (spec 014 Tab D 空狀態) rather than another task's data. */
  function getAnnotationResultsData() {
    return ANNOTATION_RESULTS_BY_TASK[TASK_DATA.taskId] || [];
  }

  function computeVaStats(annotations) {
    var vals = annotations.filter(function(a) { return a.value && a.value.valence !== undefined; });
    if (vals.length === 0) return null;
    var vArr = vals.map(function(a) { return a.value.valence; });
    var aArr = vals.map(function(a) { return a.value.arousal; });
    function mean(arr) { return arr.reduce(function(s, x) { return s + x; }, 0) / arr.length; }
    function std(arr, m) { return Math.sqrt(arr.reduce(function(s, x) { return s + (x - m) * (x - m); }, 0) / arr.length); }
    var vm = mean(vArr), am = mean(aArr), vs = std(vArr, vm), as_ = std(aArr, am);
    return { meanV: vm, meanA: am, stdV: vs, stdA: as_, minV: vm - 1.5 * vs, maxV: vm + 1.5 * vs, minA: am - 1.5 * as_, maxA: am + 1.5 * as_ };
  }

  function parseVaRangeFromStatsSummary(statsSummary) {
    if (!statsSummary) return null;
    var match = statsSummary.match(/±1\.5std V : (-?[0-9.]+)~(-?[0-9.]+)[\s\S]*±1\.5std A : (-?[0-9.]+)~(-?[0-9.]+)/);
    if (!match) return null;
    return {
      minV: parseFloat(match[1]),
      maxV: parseFloat(match[2]),
      minA: parseFloat(match[3]),
      maxA: parseFloat(match[4])
    };
  }

  function getVaColorClass(resultStr, statsSummary) {
    var vaRange = parseVaRangeFromStatsSummary(statsSummary);
    if (!vaRange) return '';
    var match = resultStr.match(/\[([0-9.]+),\s*([0-9.]+)\]/);
    if (!match) return '';
    var v = parseFloat(match[1]);
    var a = parseFloat(match[2]);
    if (v > vaRange.maxV || a > vaRange.maxA) return 'result-tag-red';
    if (v < vaRange.minV || a < vaRange.minA) return 'result-tag-blue';
    return 'result-tag-green';
  }

  function getArStatsText(sample, stats) {
    if (TASK_DATA.taskTypeKey === 'single_sentence_va_scoring') {
      if (!stats) return '-';
      return [
        'mean [' + stats.meanV.toFixed(2) + ', ' + stats.meanA.toFixed(2) + ']',
        'std [' + stats.stdV.toFixed(2) + ', ' + stats.stdA.toFixed(2) + ']',
        '±1.5std V : ' + stats.minV.toFixed(3) + '~' + stats.maxV.toFixed(3),
        '±1.5std A : ' + stats.minA.toFixed(3) + '~' + stats.maxA.toFixed(3)
      ].join('\n');
    }
    var sep = TASK_DATA.taskTypeKey === 'relation_extraction' ? '\n' : ' · ';
    if (sample.labelStatsText) return localizeResultText(sample.labelStatsText).replace(/\s·\s/g, sep);
    if (!sample.summaryStats || sample.summaryStats.length === 0) return '-';
    return sample.summaryStats.map(function(stat) {
      return localizeResultLabel(stat.label) + (stat.value ? stat.value : '');
    }).join(sep);
  }

  function localizeResultLabel(label) {
    var labelText = String(label || '');
    var labelEntry = RESULT_LABEL_I18N[labelText];
    if (!labelEntry) return labelText;
    return labelEntry[state.lang] || labelEntry.zh || labelText;
  }

  var SORTED_RESULT_LABEL_KEYS = Object.keys(RESULT_LABEL_I18N).sort(function(a, b) {
    return b.length - a.length;
  });

  function localizeResultText(text) {
    var output = String(text || '');
    if (state.lang !== 'en' || output === '-' || !output) return output;
    SORTED_RESULT_LABEL_KEYS.forEach(function(label) {
      var labelEntry = RESULT_LABEL_I18N[label];
      var translated = labelEntry && labelEntry.en ? labelEntry.en : label;
      output = output.split(label).join(translated);
    });
    return output
      .replace(/、/g, ', ')
      .replace(/（/g, ' (')
      .replace(/）/g, ')')
      .replace(/\s+,/g, ',')
      .replace(/,\s*/g, ', ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function getAnnotationResultDisplay(annotation) {
    var v = annotation.value;
    if (!v) return { tags: ['-'], colorClass: '' };
    if (v.resultText) {
      return { tags: [localizeResultText(v.resultText)], colorClass: '' };
    }
    if (v.valence !== undefined && v.arousal !== undefined) {
      return { tags: ['[' + v.valence + ', ' + v.arousal + ']'], colorClass: '' };
    }
    if (v.labels && v.labels.length > 0) {
      return { tags: [v.labels.map(localizeResultLabel).join(', ')], colorClass: '' };
    }
    if (v.aspects && v.aspects.length > 0) {
      return { tags: [v.aspects.map(localizeResultLabel).join(', ')], colorClass: '' };
    }
    if (v.entities && v.entities.length > 0) {
      return {
        tags: [v.entities.map(function(entity) { return entity.type + ':' + localizeResultText(entity.text); }).join(', ')],
        colorClass: ''
      };
    }
    if (v.triples && v.triples.length > 0) {
      return { tags: [v.triples.join(' | ')], colorClass: '' };
    }
    if (v.label) {
      return { tags: [localizeResultLabel(v.label)], colorClass: '' };
    }
    return { tags: ['-'], colorClass: '' };
  }

  function renderArDistCell(td, sample, statsText) {
    var statsEl = document.createElement('span');
    statsEl.className = 'reviewer-stats';
    statsEl.textContent = statsText || getArStatsText(sample, computeVaStats(sample.annotations));
    td.className = 'reviewer-stats-cell';
    td.appendChild(statsEl);
  }

  /* AR_REVIEW_STATUS — five-state review vocabulary reused from spec 015 REVIEW_UNIT_STATUS. */
  var AR_REVIEW_STATUS_ORDER = ['pending', 'approved', 'modified', 'disputed', 'finalized'];
  var AR_REVIEW_STATUS_LABEL_KEYS = {
    pending: 'arReviewPending',
    approved: 'arReviewApproved',
    modified: 'arReviewModified',
    disputed: 'arReviewDisputed',
    finalized: 'arReviewFinalized'
  };

  function getArReviewBadge(reviewStatus) {
    var map = {
      approved: { cls: 'badge-ar-approved', label: t('arReviewApproved') },
      modified: { cls: 'badge-ar-modified', label: t('arReviewModified') },
      disputed: { cls: 'badge-ar-disputed', label: t('arReviewDisputed') },
      finalized: { cls: 'badge-ar-finalized', label: t('arReviewFinalized') },
      pending: { cls: 'badge-ar-pending-review', label: t('arReviewPending') }
    };
    return map[reviewStatus] || map.pending;
  }

  function annotationHasReviewer(annotation, reviewer) {
    var inReviews = (annotation.reviews || []).some(function(review) { return review.reviewer === reviewer; });
    return inReviews || !!(annotation.arbitration && annotation.arbitration.arbiter === reviewer);
  }

  function getArFilteredSamples() {
    return getAnnotationResultsData().filter(function(sample) {
      if (state.arStage !== 'all' && sample.stage !== state.arStage) return false;
      if (state.arStatus !== 'all' && sample.status !== state.arStatus) return false;
      if (state.arAnnotator !== 'all') {
        var hasAnnotator = sample.annotations.some(function(a) { return a.annotator === state.arAnnotator; });
        if (!hasAnnotator) return false;
      }
      if (state.arReviewer !== 'all') {
        var hasReviewer = sample.annotations.some(function(a) { return annotationHasReviewer(a, state.arReviewer); });
        if (!hasReviewer) return false;
      }
      if (state.arReviewStatus !== 'all') {
        var hasReviewStatus = sample.annotations.some(function(a) { return (a.reviewStatus || 'pending') === state.arReviewStatus; });
        if (!hasReviewStatus) return false;
      }
      return true;
    });
  }

  function getArReviewers() {
    var seen = {};
    var list = [];
    getAnnotationResultsData().forEach(function(sample) {
      sample.annotations.forEach(function(a) {
        (a.reviews || []).forEach(function(review) {
          if (!seen[review.reviewer]) { seen[review.reviewer] = true; list.push(review.reviewer); }
        });
        if (a.arbitration && !seen[a.arbitration.arbiter]) {
          seen[a.arbitration.arbiter] = true;
          list.push(a.arbitration.arbiter);
        }
      });
    });
    return list;
  }

  function renderArReviewerSelect() {
    var sel = document.getElementById('arReviewerSelect');
    if (!sel) return;
    var current = sel.value || state.arReviewer;
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    var allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = t('arReviewerAll');
    sel.appendChild(allOpt);
    getArReviewers().forEach(function(name) {
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
    sel.value = current;
  }

    var allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = t('arReviewStatusAll');
    sel.appendChild(allOpt);
    AR_REVIEW_STATUS_ORDER.forEach(function(status) {

  function getArAnnotators() {
    var seen = {};
    var list = [];
    getAnnotationResultsData().forEach(function(sample) {
      sample.annotations.forEach(function(a) {
        if (!seen[a.annotator]) { seen[a.annotator] = true; list.push(a.annotator); }

  function renderArAnnotatorSelect() {
    var sel = document.getElementById('arAnnotatorSelect');
    if (!sel) return;
    var current = sel.value || state.arAnnotator;
    while (sel.firstChild) sel.removeChild(sel.firstChild);

  function buildArHistoryLine(lineClass, roleText, nameText, decisionText, timeText) {
    var line = document.createElement('div');
    line.className = 'ar-history-line ' + lineClass;
    var role = document.createElement('span');
    role.className = 'ar-history-role';
    role.textContent = roleText;
    var name = document.createElement('span');
    name.className = 'ar-history-name';
    name.textContent = nameText;
    var decision = document.createElement('span');
    decision.className = 'ar-history-decision';
    decision.textContent = decisionText;
    var time = document.createElement('span');
    time.className = 'ar-history-time';
    time.textContent = timeText || '-';
    line.appendChild(role);
    line.appendChild(name);
    line.appendChild(decision);
    line.appendChild(time);
    return line;
  }

  function appendArHistoryLines(container, annotation) {
    (annotation.reviews || []).forEach(function(review) {
      var decisionText = review.decision === 'modified'
        ? t('arHistoryModifiedPrefix') + getAnnotationResultDisplay({ value: review.result }).tags[0]
        : t('arHistoryAgree');
      var reviewLine = buildArHistoryLine(
        'ar-history-review', t('arHistoryReviewerRole'), review.reviewer, decisionText, review.reviewedAt
      );
      reviewLine.setAttribute('data-annotator', annotation.annotator);
      container.appendChild(reviewLine);
    });
    if (annotation.arbitration) {
      var arbitrationLine = buildArHistoryLine(
        'ar-history-arbitration',
        t('arHistoryArbiterRole'),
        annotation.arbitration.arbiter,
        annotation.arbitration.pick === 'A' ? t('arHistoryPickA') : t('arHistoryPickB'),
        annotation.arbitration.decidedAt
      );
      arbitrationLine.setAttribute('data-annotator', annotation.annotator);
      container.appendChild(arbitrationLine);
    }
  }

  function getArStatusBadge(status) {
    var map = { submitted: 'badge-ar-submitted', draft: 'badge-ar-draft', pending: 'badge-ar-pending' };
    var labelKey = { submitted: 'arStatusBadgeSubmitted', draft: 'arStatusBadgeDraft', pending: 'arStatusBadgePending' };
    return { cls: map[status] || 'badge-ar-pending', label: t(labelKey[status] || 'arStatusBadgePending') };
  }

  function renderArResultTable(samples) {
    var tbody = document.getElementById('arResultTableBody');
    if (!tbody) return;
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

    samples.forEach(function(sample) {
      var expanded = !!state.arExpandedRows[sample.sampleId];
      var text = state.lang === 'en' ? sample.textEn : sample.textZh;
      var textPreview = text.length > 48 ? text.slice(0, 48) + '…' : text;
      var statusBadge = getArStatusBadge(sample.status);
      var vaStatsText = TASK_DATA.taskTypeKey === 'single_sentence_va_scoring'
        ? getArStatsText(sample, computeVaStats(sample.annotations))
        : '';

      var tr = document.createElement('tr');
      tr.className = 'ar-summary-row';

      var tdExpand = document.createElement('td');
      var expandBtn = document.createElement('button');
      expandBtn.className = 'ar-expand-btn' + (expanded ? ' expanded' : '');
      expandBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      expandBtn.setAttribute('aria-label', expanded ? '收合' : '展開');
      expandBtn.type = 'button';
      var chevronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      chevronSvg.setAttribute('viewBox', '0 0 24 24');
