<div id="annotationProgressPanel" class="hidden" aria-live="polite">
  <section class="panel" aria-labelledby="progressSummaryTitle">
    <div class="stage-filter-row">
      <h2 class="panel-title" id="progressSummaryTitle" style="margin-bottom: 0;">整體進度摘要</h2>
      <div class="stage-toggle" id="progressRoundPills" role="tablist" aria-label="Round selector"></div>
    </div>
    <div class="phase-flow" id="roundProgressList"></div>
    <div class="progress-metric-grid">
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricTotalLabel">總樣本數</span><span class="progress-metric-value" id="progressMetricTotalValue">-</span></article>
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricCompletedLabel">已完成數</span><span class="progress-metric-value" id="progressMetricCompletedValue">-</span></article>
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricRateLabel">完成率</span><span class="progress-metric-value" id="progressMetricRateValue">-</span></article>
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricSpeedLabel">平均速度</span><span class="progress-metric-value" id="progressMetricSpeedValue">-</span></article>
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricEtaLabel">剩餘估計時間</span><span class="progress-metric-value" id="progressMetricEtaValue">-</span></article>
      <article class="progress-metric-item"><span class="progress-metric-key" id="progressMetricIAALabel">IAA</span><span class="progress-metric-value" id="progressMetricIAAValue">-</span></article>
    </div>
  </section>

  <!-- FR-018 (issue #688): final exception pool entry -- read-only list of
       arbitration-rejected review units awaiting the project leader's
       disposition on annotation/015-annotation-workspace's FR-095 screen.
       Rendered by renderFinalExceptionPool() in task-detail.html. project_leader
       only (FR-018 point 4); MUST NOT be hidden at count 0 (FR-018 point 1),
       only its empty state / table swap. -->
  <section class="panel" aria-labelledby="finalExceptionPoolTitle" id="finalExceptionPoolSection">
    <div class="stage-filter-row">
      <h2 class="panel-title" id="finalExceptionPoolTitle" style="margin-bottom: 0;"></h2>
      <select class="sort-select" id="finalExceptionPoolRunTypeFilter" aria-label="Final exception pool run type filter">
        <option value="official_run" id="finalExceptionPoolRunTypeOfficialOpt"></option>
        <option value="dry_run" id="finalExceptionPoolRunTypeDryOpt"></option>
      </select>
    </div>
    <p class="panel-subtitle hidden" id="finalExceptionPoolEmpty"></p>
    <div class="table-wrap" id="finalExceptionPoolTableWrap">
      <div class="table-scroll">
        <table class="member-table" role="table" aria-label="Final exception pool table">
          <thead>
            <tr>
              <th id="thExceptionSample">樣本 ID</th>
              <th id="thExceptionAnnotator">標記員</th>
              <th id="thExceptionReviewer">審核員</th>
              <th id="thExceptionOutputType">爭議輸出類型</th>
              <th id="thExceptionArbiter">仲裁者</th>
              <th id="thExceptionReason">理由</th>
              <th id="thExceptionEnteredAt">落入時間</th>
              <th id="thExceptionActions">操作</th>
            </tr>
          </thead>
          <tbody id="finalExceptionPoolBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel hidden" aria-labelledby="unassignedAnnotationTitle" id="unassignedAnnotationSection">
    <h2 class="panel-title" id="unassignedAnnotationTitle">未指派標記作業</h2>
    <p class="panel-subtitle" id="unassignedAnnotationSubtitle">未指派試標作業會阻擋進入待 IAA 確認；正式標記未指派作業會影響完成率。請重新指派給啟用中的標記員，或排除並保留原因。</p>
    <div class="table-wrap">
      <div class="table-scroll">
        <table class="member-table" role="table" aria-label="Unassigned dry run assignments table">
          <thead>
            <tr>
              <th id="thUnassignedStage">階段 / 回合</th>
              <th id="thUnassignedSamples">樣本</th>
              <th id="thUnassignedSource">來源成員</th>
              <th id="thUnassignedReason">原因</th>
              <th id="thUnassignedAssignTo">指派給</th>
              <th id="thUnassignedActions">操作</th>
            </tr>
          </thead>
          <tbody id="unassignedAnnotationBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="memberProgressTitle" id="memberProgressSection">
    <h2 class="panel-title" id="memberProgressTitle">成員進度表</h2>
    <div class="sort-row">
      <label class="sort-label" id="progressSortLabel" for="memberProgressSort">排序</label>
      <select class="sort-select" id="memberProgressSort" aria-label="Sort member progress">
        <option value="completed_desc" id="progressSortCompleted">依已完成數（高到低）</option>
        <option value="speed_desc" id="progressSortSpeed">依平均速度（高到低）</option>
        <option value="submitted_desc" id="progressSortSubmitted">依最後提交（新到舊）</option>
      </select>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table class="member-table" role="table" aria-label="Member progress table">
          <thead>
            <tr>
              <th id="thProgressMemberName">成員姓名</th>
              <th id="thProgressRole">角色</th>
              <th id="thProgressCompleted">已完成數</th>
              <th id="thProgressPending">待完成數</th>
              <th id="thProgressTotal">總數量</th>
              <th id="thProgressSpeed">平均速度</th>
              <th id="thProgressBar">個人進度條</th>
              <th id="thProgressLastSubmitted">最後提交時間</th>
              <th id="thProgressQuality">品質旗標</th>
              <th id="thProgressDetails">操作</th>
            </tr>
          </thead>
          <tbody id="memberProgressTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel hidden" aria-labelledby="memberDetailTitle" id="memberDetailSection">
    <div class="member-detail-header">
      <h2 class="panel-title" id="memberDetailTitle"></h2>
      <button class="modal-close-btn" type="button" id="memberDetailCloseBtn" aria-label="關閉">
        <svg class="modal-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table class="member-table" id="memberDetailTable" role="table" aria-labelledby="memberDetailTitle">
          <thead>
            <tr>
              <th id="thDetailSampleId">樣本 ID</th>
              <th id="thDetailTextPreview">文本摘要</th>
              <th id="thDetailLabelResult">標記結果</th>
              <th id="thDetailSubmittedAt">提交時間</th>
              <th id="thDetailReviewStatus">審核狀態</th>
            </tr>
          </thead>
          <tbody id="memberDetailTableBody"></tbody>
        </table>
      </div>
      <div class="pagination hidden" id="mdPaginationBar">
        <div class="pagination-left">
          <span class="pagination-info" id="mdPaginationInfo"></span>
          <select class="page-size-select" id="mdPageSizeSelect" aria-label="每頁筆數">
            <option value="20" selected>20 筆/頁</option>
            <option value="50">50 筆/頁</option>
            <option value="100">100 筆/頁</option>
          </select>
        </div>
        <div class="pagination-controls" id="mdPaginationControls">
          <button class="page-btn" type="button" id="mdPrevPageBtn" aria-label="上一頁" disabled>
            <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="page-btn" type="button" id="mdNextPageBtn" aria-label="下一頁">
            <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
    <p class="member-detail-empty hidden" id="memberDetailEmpty"></p>
  </section>

  <section class="panel hidden" aria-labelledby="progressEmptyTitle" id="progressEmptyState">
    <div class="progress-empty-state">
      <p class="progress-empty-title" id="progressEmptyTitle">尚無成員進度資料</p>
      <button class="btn btn-secondary" type="button" id="progressBackToOverviewBtn">回到任務概覽</button>
    </div>
  </section>
</div>
