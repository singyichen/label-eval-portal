<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Label Suite — 資料集分析詳情</title>
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <link rel="stylesheet" href="../shared/sidebar.css" />
  <script src="../../assets/theme-fouc.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Color/font/radius/shadow/spacing/motion/z-index tokens come from
       ../../assets/tokens.css; only page-local layout variables live here.
       (The removed local --z-toast: 300 collided with the canonical
       --z-modal — toasts now stack at the canonical --z-toast: 400.) */
    :root {
      --navbar-mobile-height: 84px; --navbar-mobile-top-height: 64px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px}
    body{font-family:var(--font-sans);background:var(--color-surface);color:var(--color-ink);line-height:1.8;min-height:100vh;display:flex;flex-direction:row}
    html[lang="en"] body{line-height:1.6}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit;cursor:pointer}
    .hidden{display:none !important}

    main{flex:1;display:flex;flex-direction:column;overflow-y:auto}
    .layout{max-width:1280px;width:100%;margin:0 auto;padding:var(--space-lg)}

    /* Breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-soft);margin-bottom:12px}
    .breadcrumb a{color:var(--color-primary)}
    .breadcrumb a:hover{text-decoration:underline}
    .breadcrumb-sep{color:var(--color-ink-muted);font-size:11px}

    /* Page header */
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-md);margin-bottom:var(--space-lg);flex-wrap:wrap}
    .page-main-title{font-family:var(--font-serif-display);font-size:28px;line-height:1.3;font-weight:700;color:var(--color-ink);margin:0 0 4px}
    .page-main-subtitle{font-size:14px;line-height:1.8;color:var(--color-text-soft);margin:0}

    /* Tabs */
    .admin-tabs{display:flex;border-bottom:2px solid var(--color-border);margin-bottom:var(--space-lg)}
    .admin-tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--color-text-soft);border-bottom:2px solid transparent;margin-bottom:-2px;background:transparent;border-left:none;border-right:none;border-top:none;transition:color var(--dur-fast),border-color var(--dur-fast)}
    .admin-tab:hover{color:var(--color-primary)}
    .admin-tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary);font-weight:600}

    /* Panel */
    .panel{border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:var(--space-lg);margin-bottom:var(--space-md)}
    .panel-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-sm);margin-bottom:var(--space-md);flex-wrap:wrap}
    .panel-title{font-size:16px;font-weight:700;color:var(--color-ink)}
    .panel-load-error{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
    .panel-subtitle{font-size:13px;color:var(--color-text-soft);margin-top:2px}
    .panel-divider{border:none;border-top:1px solid var(--color-border-muted);margin:var(--space-md) 0}

    /* Badges */
    .badge{display:inline-flex;align-items:center;border-radius:var(--radius-sm);border:1px solid transparent;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.4;white-space:nowrap}
    .badge-pass{color:var(--color-success);background:var(--color-success-bg);border-color:var(--color-success-border)}
    .badge-fail{color:var(--color-error);background:var(--color-error-bg);border-color:var(--color-error-border)}
    .badge-warn{color:var(--color-warning);background:var(--color-warning-bg);border-color:var(--color-warning-border)}
    .badge-neutral{color:var(--color-text-soft);background:var(--color-slate-50);border-color:var(--color-border)}
    .iaa-summary-badge{font-size:13px;padding:4px 12px;border-radius:var(--radius-full)}

    /* IAA method row */
    .iaa-method-row{display:flex;align-items:center;gap:8px;margin-bottom:var(--space-md);font-size:13px;color:var(--color-text-soft)}
    .iaa-method-name{font-weight:700;color:var(--color-ink)}
    .iaa-primary-star{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--color-warning-bg);border:1px solid var(--color-warning-border);border-radius:var(--radius-sm);color:var(--color-warning);flex-shrink:0}
    .iaa-primary-star svg{width:11px;height:11px}

    /* IAA score cards */
    .iaa-score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:var(--space-md)}
    .iaa-score-grid-1{grid-template-columns:1fr;max-width:320px}
    .iaa-score-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px 16px;background:var(--color-slate-50)}
    .iaa-score-card.card-pass{border-color:var(--color-success-border);background:var(--color-success-bg)}
    .iaa-score-card.card-warn{border-color:var(--color-warning-border);background:var(--color-warning-bg)}
    .iaa-score-card.card-fail{border-color:var(--color-error-border);background:var(--color-error-bg)}
    .iaa-card-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-ink-muted);margin-bottom:6px}
    .iaa-card-value{font-size:32px;font-weight:700;line-height:1.1;font-family:var(--font-mono);margin-bottom:2px}
    .iaa-card-value.pass{color:var(--color-success)}
    .iaa-card-value.warn{color:var(--color-warning)}
    .iaa-card-value.fail{color:var(--color-error)}
    .iaa-card-calc{font-size:11px;color:var(--color-ink-muted);margin-bottom:10px}
    .iaa-bar-wrap{height:8px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden;margin-bottom:8px}
    .iaa-bar-fill{height:100%;border-radius:var(--radius-full);transition:width .5s var(--ease-standard)}
    .iaa-bar-fill.pass{background:var(--color-success)}
    .iaa-bar-fill.warn{background:var(--color-warning)}
    .iaa-bar-fill.fail{background:var(--color-error)}
    .iaa-threshold-row{display:flex;flex-wrap:wrap;gap:8px;font-size:11px}
    .iaa-threshold-item{display:flex;align-items:center;gap:4px}
    .t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .t-dot-pass{background:var(--color-success)}
    .t-dot-fail{background:var(--color-error)}
    .t-dot-warn{background:var(--color-warning)}
    .t-pass{color:var(--color-success);font-weight:600}
    .t-fail{color:var(--color-error);font-weight:600}
    .t-warn{color:var(--color-warning);font-weight:600}

    /* Match toggle (sequence labeling) */
    .match-toggle{display:inline-flex;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:2px;background:var(--color-slate-50);gap:2px;margin-bottom:var(--space-sm)}
    .match-btn{border:1px solid transparent;border-radius:6px;background:transparent;color:var(--color-text-soft);font-size:12px;font-weight:600;padding:5px 10px}
    .match-btn.active{background:var(--color-white);color:var(--color-primary);border-color:var(--color-primary-border)}
    .match-btn:hover{color:var(--color-primary)}

    /* Collapsible alt metrics */
    .alt-toggle-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--color-primary);background:transparent;border:none;padding:6px 0;margin-top:4px}
    .alt-toggle-btn:hover{text-decoration:underline}
    .alt-toggle-icon{transition:transform var(--dur-fast)}
    .alt-toggle-btn.open .alt-toggle-icon{transform:rotate(180deg)}
    .alt-metrics-body{display:none;margin-top:var(--space-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
    .alt-metrics-body.open{display:block}
    .alt-table{width:100%;border-collapse:collapse;font-size:13px}
    .alt-table th{background:var(--color-slate-50);border-bottom:1px solid var(--color-border);padding:8px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--color-ink-muted);text-align:left}
    .alt-table td{padding:9px 14px;border-bottom:1px solid var(--color-border-muted);color:var(--color-ink);vertical-align:middle}
    .alt-table tbody tr:last-child td{border-bottom:none}
    .alt-metric-name{font-weight:600}
    .alt-metric-note{font-size:11px;color:var(--color-ink-muted)}

    /* Anomaly */
    .anomaly-group-title{font-size:13px;font-weight:700;color:var(--color-ink);margin:var(--space-md) 0 8px}
    .anomaly-group-title:first-child{margin-top:0}
    .anomaly-list{list-style:none;display:grid;gap:8px}
    .anomaly-item{border:1px solid var(--color-warning-border);background:var(--color-warning-bg);border-radius:var(--radius-md);color:var(--color-warning);padding:10px 12px;font-size:13px;line-height:1.6;display:flex;align-items:flex-start;gap:8px}
    .anomaly-icon{width:16px;height:16px;flex-shrink:0;margin-top:2px;opacity:.9}
    .anomaly-body{flex:1}
    .anomaly-title{font-weight:600}
    .anomaly-detail{color:var(--color-ink-muted);font-size:12px;margin-top:2px}
    .anomaly-empty{border:1px dashed var(--color-border);border-radius:var(--radius-md);background:var(--color-slate-50);padding:14px;font-size:13px;color:var(--color-text-soft);text-align:center}

    /* Annotator table */
    .table-wrap{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background:var(--color-white)}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .annotator-table{width:100%;border-collapse:collapse;text-align:left}
    .annotator-table thead tr{background:var(--color-slate-50);border-bottom:1px solid var(--color-border)}
    .annotator-table th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--color-ink-muted);font-weight:600;padding:12px 14px;white-space:nowrap}
    .annotator-table td{padding:12px 14px;border-bottom:1px solid var(--color-border-muted);font-size:13px;color:var(--color-ink);vertical-align:middle;white-space:nowrap}
    .annotator-table tbody tr:last-child td{border-bottom:none}
    .annotator-name{font-weight:700}
    .delta-pos{color:var(--color-success);font-weight:600}
    .delta-neg{color:var(--color-error);font-weight:600}
    .speed-flag{display:inline-flex;color:var(--color-warning);margin-left:4px;vertical-align:middle}
    .speed-flag svg{width:13px;height:13px}
    .speed-warn{color:var(--color-warning)}
    .group-avg-note{font-size:12px;color:var(--color-text-soft);margin-top:10px}
    .risk-level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-full);border:1px solid transparent;font-size:12px;font-weight:700;white-space:nowrap}
    .risk-level-badge.normal{color:var(--color-success);background:var(--color-success-bg);border-color:var(--color-success-border)}
    .risk-level-badge.watch{color:var(--color-warning);background:var(--color-warning-bg);border-color:var(--color-warning-border)}
    .risk-level-badge.high{color:var(--color-error);background:var(--color-error-bg);border-color:var(--color-error-border)}
    .risk-level-badge.insufficient{color:var(--color-text-soft);background:var(--color-slate-50);border-color:var(--color-border)}
    .cause-stack{display:flex;flex-wrap:wrap;gap:6px;min-width:180px}
    .cause-chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-full);background:var(--color-primary-soft-bg);border:1px solid var(--color-primary-border);color:var(--color-primary);font-size:11px;font-weight:600}
    .cause-text-block{display:grid;gap:4px;min-width:180px}
    .cause-line{font-size:12px;color:var(--color-ink)}
    .cause-line strong{color:var(--color-ink-muted);font-weight:700}
    .cause-muted{font-size:12px;color:var(--color-text-soft);white-space:normal}
    .action-stack{display:grid;gap:8px;min-width:140px}
    .risk-action-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
    .risk-readonly-note{font-size:11px;color:var(--color-text-soft);line-height:1.5;white-space:normal}

    /* Quality empty state */
    .quality-empty{border:1px dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:48px var(--space-lg);text-align:center}
    .quality-empty-icon{width:40px;height:40px;margin:0 auto 14px;color:var(--color-ink-muted);opacity:.6}
    .quality-empty-title{font-size:15px;font-weight:700;color:var(--color-ink);margin-bottom:8px}
    .quality-empty-desc{font-size:13px;color:var(--color-text-soft);max-width:400px;margin:0 auto 18px;line-height:1.7}

    /* Stats placeholder */
    .stats-placeholder{border:1px dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:48px var(--space-lg);text-align:center;color:var(--color-text-soft);font-size:14px}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-md);border:1px solid transparent;font-size:14px;font-weight:600;transition:background var(--dur-fast),color var(--dur-fast),opacity var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
    .btn:hover{transform:translateY(-1px)}
    .btn-secondary{color:var(--color-ink);background:var(--color-white);border-color:var(--color-border)}
    .btn-secondary:hover{border-color:var(--color-primary);color:var(--color-primary)}
    .btn-sm{padding:6px 12px;font-size:13px}

    /* Toast (top-center, UXC-07 / MASTER §Toast) */
    .toast-container{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:var(--z-toast);width:min(384px,calc(100vw - 32px));pointer-events:none}
    /* shadow-md: Toast is an approved exception to the no-shadow rule.
       visibility keeps the hidden close button out of the tab order;
       its 0s transition is delayed so the fade-out still plays. */
    .toast{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1px solid transparent;border-radius:var(--radius-md);font-size:14px;font-weight:500;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;transition:opacity var(--dur-fast),visibility 0s var(--dur-fast)}
    .toast.visible{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur-fast)}
    .toast-success{color:var(--color-success);background:var(--color-success-bg);border-color:var(--color-success-border)}
    .toast-info{color:var(--color-info);background:var(--color-info-bg);border-color:var(--color-info-border)}
    .toast-warning{color:var(--color-warning);background:var(--color-warning-bg);border-color:var(--color-warning-border)}
    .toast-error{color:var(--color-error);background:var(--color-error-bg);border-color:var(--color-error-border)}
    .toast-msg{flex:1}
    .toast-close{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;line-height:1.4;padding:0}
    .toast-close:hover{opacity:1}

    /* Stats tab */
    .stats-metric-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .stats-metric-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px 16px;background:var(--color-slate-50)}
    .stats-metric-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-ink-muted);margin-bottom:6px}
    .stats-metric-value{font-size:32px;font-weight:700;line-height:1.1;font-family:var(--font-mono);color:var(--color-ink);margin-bottom:2px}
    .stats-metric-desc{font-size:12px;color:var(--color-text-soft)}
    .stats-empty{border:1px dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:48px var(--space-lg);text-align:center}
    .stats-empty-icon{width:40px;height:40px;margin:0 auto 14px;color:var(--color-ink-muted);opacity:.6}
    .stats-empty-title{font-size:15px;font-weight:700;color:var(--color-ink);margin-bottom:8px}
    .stats-empty-desc{font-size:13px;color:var(--color-text-soft);max-width:400px;margin:0 auto 18px;line-height:1.7}
    .stats-hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg)}
    .stats-chart-label{font-size:11px;font-weight:600;color:var(--color-ink-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
    .stats-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)}
    .stats-summary-block{background:var(--color-slate-50);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 16px}
    .stats-summary-head{font-size:11px;font-weight:700;color:var(--color-ink-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    .stats-summary-row{display:flex;gap:var(--space-lg);flex-wrap:wrap}
    .stats-summary-item{display:flex;flex-direction:column;gap:2px}
    .stats-summary-item-label{font-size:10px;color:var(--color-text-soft);text-transform:uppercase;letter-spacing:.04em}
    .stats-summary-item-val{font-size:18px;font-weight:700;font-family:var(--font-mono);color:var(--color-ink)}
    .stats-scatter-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .stats-hbar-chart{display:grid;gap:10px}
    .stats-hbar-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:8px;font-size:13px}
    .stats-hbar-label{color:var(--color-ink);font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
    .stats-hbar-track{height:10px;background:var(--color-border-muted);border-radius:var(--radius-full);overflow:hidden}
    .stats-hbar-fill{height:100%;border-radius:var(--radius-full);background:var(--color-primary);transition:width .4s var(--ease-standard)}
    .stats-hbar-value{color:var(--color-text-soft);font-size:11px;font-family:var(--font-mono)}
    .stats-comatrix{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:var(--space-sm)}
    .stats-comatrix-table{border-collapse:collapse;font-size:12px;white-space:nowrap}
    .stats-comatrix-table th{background:var(--color-slate-50);border:1px solid var(--color-border);padding:7px 12px;font-weight:600;color:var(--color-ink-muted)}
    .stats-comatrix-table td{border:1px solid var(--color-border);padding:7px 12px;text-align:center;font-family:var(--font-mono);font-size:12px}
    .stats-comatrix-diag{background:var(--color-primary-soft-bg);color:var(--color-primary);font-weight:700}
    .stats-comatrix-hi{background:var(--color-primary-soft-bg);color:var(--color-ink)}
    .stats-comatrix-mid{background:var(--color-slate-50);color:var(--color-text-soft)}
    .stats-comatrix-low{color:var(--color-ink-muted)}
    .stats-inline-card{display:inline-flex;align-items:center;gap:var(--space-md);padding:16px 24px;background:var(--color-slate-50);border:1px solid var(--color-border);border-radius:var(--radius-md)}

    /* Responsive */
    @media(max-width:767px){
      .layout{padding:var(--space-md) var(--space-md) var(--space-xl)}
      .admin-tabs{overflow-x:auto}
      .iaa-score-grid{grid-template-columns:1fr}
      .stats-metric-grid{grid-template-columns:1fr}
      .stats-hist-grid{grid-template-columns:1fr}
      .stats-summary-grid{grid-template-columns:1fr}
      .stats-hbar-row{grid-template-columns:80px 1fr 60px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
    }

    /* ── Dark mode overrides ──────────────────────────────────── */
    html[data-theme="dark"] {
      /* Task-type badges */
      .badge-task-type-single   { color: #A5F3FC; background: #0C2230; border-color: #155E75; }
      .badge-task-type-sequence { color: #FB923C; background: #2A1805; border-color: #7C3A16; }
      .badge-task-type-relation { color: #A5F3FC; background: #0C2230; border-color: #155E75; }
      .badge-task-type-pairs    { color: #4ADE80; background: #0F2A18; border-color: #1F5132; }
      .badge-task-type-scoring  { color: #C084FC; background: #1A0A2E; border-color: #4C1D95; }
      .badge-task-type-default  { color: #94A3B8; background: #1F1F28; border-color: #2A2A35; }
    }
  </style>
</head>

<main id="detailMain">
<div class="layout">

  <!-- Page header -->
  <header class="page-header">
    <div>
      <h1 class="page-main-title" id="pageTitle">任務詳情</h1>
      <p class="page-main-subtitle" id="pageSubtitle">檢視統計總覽與品質監控</p>
    </div>
  </header>

  <!-- Breadcrumb -->
  <nav class="breadcrumb" aria-label="breadcrumb">

/* ── Composite IAA badge (FR-024A/B/C, SC-021/022/023) ────────────── */
function computeCompositeBadge(taskMeta) {
  var outputs = (taskMeta && taskMeta.outputs) || [];
  var iaaData = (taskMeta && taskMeta.iaaData) || {};
  var counted = outputs.filter(function(type) {
    return IAA_GATE_EXCLUDED_TYPES.indexOf(type) === -1 && IAA_UNCALIBRATED_TYPES.indexOf(type) === -1;
  });
  var excludedCount = outputs.length - counted.length;
  var y = counted.length;
  if (y === 0) return { state: 'not_applicable', x: 0, y: 0, excludedCount: excludedCount };
  var x = 0, hasPending = false;
  counted.forEach(function(type) {
    var d = iaaData[type];
    if (!d) { hasPending = true; return; }
    if (d.pass) x += 1;
  });
  if (hasPending) return { state: 'pending', x: null, y: y, excludedCount: excludedCount };
  return { state: x === y ? 'pass' : 'fail', x: x, y: y, excludedCount: excludedCount };
}
function fmt(template, vars) {
  return String(template).replace(/\{(\w+)\}/g, function(_, key) {
    return vars[key] !== undefined ? vars[key] : '';
  });
}
function compositeBadgeText(result) {
  if (result.state === 'not_applicable') return t('iaaNotApplicableBadge');
  if (result.state === 'pending') return fmt(t('iaaPendingBadgeFmt'), { y: result.y });
  var text = fmt(t('iaaCompositeBadgeFmt'), { x: result.x, y: result.y });
  if (result.excludedCount > 0) text += fmt(t('iaaExcludedSuffixFmt'), { N: result.excludedCount });
  return text;
}

function t(key) {
  var dict = I18N[S.lang] || I18N.zh;
  return dict[key] !== undefined ? dict[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
}
function tPath(path) {
  var parts = String(path || '').split('.');
  function read(obj) {
    var cur = obj;
    for (var i = 0; i < parts.length; i += 1) {
      if (!cur || typeof cur !== 'object' || cur[parts[i]] === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  var localized = read(I18N[S.lang] || I18N.zh);
  if (localized !== undefined) return localized;
  var fallback = read(I18N.zh);
  return fallback !== undefined ? fallback : path;
}
function setText(id, key) {
  var el = document.getElementById(id);
  if (!el) return;
  var v = t(key);
  if (typeof v === 'string') el.textContent = v;
}
function applyDataI18n(root) {
  if (!root || !root.querySelectorAll) return;
  Array.prototype.forEach.call(root.querySelectorAll('[data-i18n]'), function(el) {
    var value = tPath(el.getAttribute('data-i18n'));
    if (typeof value === 'string') el.textContent = value;
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-i18n-html]'), function(el) {
    var value = tPath(el.getAttribute('data-i18n-html'));
    if (typeof value === 'string') el.innerHTML = value;
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-i18n-aria-label]'), function(el) {
    var value = tPath(el.getAttribute('data-i18n-aria-label'));
    if (typeof value === 'string') el.setAttribute('aria-label', value);
  });
}

/* Risk-table action buttons live inside quality-*.html partials injected at

  S.lang = l;
  document.documentElement.lang = l === 'en' ? 'en' : 'zh-TW';
  document.title = t('docTitle');
  SIMPLE_IDS.forEach(function(id) { setText(id, id); });

  document.getElementById('pageSubtitle').textContent = t('pageSubtitle');
  document.getElementById('tabStats').textContent = t('tabStats');
  document.getElementById('tabQuality').textContent = t('tabQuality');
  applyTypeContent();
  applyQualityState();
  if (window.LabelSuiteSharedSidebar) {
    window.LabelSuiteSharedSidebar.applyGlobalLanguage(l, {
      langToggleAria: l === 'zh' ? '切換語言' : 'Switch language',
      roleLabel: t('roleUser'),

    ['navDashboard', 'navTaskManagement', 'navAnnotation', 'navDataset', 'navAdmin', 'navProfile'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = t(id);
    });
  }
  if (window.LabelSuiteAnalytics) {
    window.LabelSuiteAnalytics.track('prototype_lang_switched', { lang: l });
  }
}

/* ── Summary badge (task-level composite, shown once — FR-024A) ──── */
function updateSummaryBadge() {
  var badge = document.getElementById('iaaSummaryBadge');
  if (!badge) return;
  var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
  // SC-006B: entity_recognition's partial-overlap F1 display toggle (S.seqMode) is
  // display-only and must never change the composite gate state — strict Span F1 is
  // the only metric that gates pass/fail (iaaData.pass is fixed regardless of S.seqMode).
  var result = computeCompositeBadge(taskMeta);
  var cssState = (result.state === 'pending' || result.state === 'not_applicable') ? 'neutral' : result.state;
  badge.className = 'badge iaa-summary-badge badge-' + cssState;
  badge.textContent = compositeBadgeText(result);
}

/* ── Small-sample badge (FR: n < IAA_SMALL_SAMPLE_THRESHOLD) ──────── */
/* n is a per-output-type flag, so every entry in outputs[] must be evaluated
   independently (not just the primary outputs[0]) — a composite task's
   secondary type can be small-sample even when the primary is not. */
function applySmallSampleBadge() {
  var mount = document.getElementById('qualityPanelMount');
  if (!mount) return;
  Array.prototype.forEach.call(mount.querySelectorAll('.small-sample-badge'), function(el) { el.remove(); });
  var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
  var outputs = (taskMeta && taskMeta.outputs && taskMeta.outputs.length) ? taskMeta.outputs : [S.type];
  var iaaData = (taskMeta && taskMeta.iaaData) || {};
  outputs.forEach(function(type, index) {
    var data = iaaData[type];
    if (!data || data.n === undefined || data.n >= IAA_SMALL_SAMPLE_THRESHOLD) return;
    // Primary type is mounted in full under the un-namespaced iaaTitle section; secondary
    // types are the buildSecondaryIaaBlock() wrappers tagged with data-output-type.
    var scope = index === 0
      ? mount.querySelector('section[aria-labelledby="iaaTitle"]')
      : mount.querySelector('section[data-output-type="' + type + '"]');
    var thresholdRow = scope && scope.querySelector('.iaa-threshold-row');
    if (!thresholdRow) return;
    var badge = document.createElement('span');
    badge.className = 'badge badge-neutral small-sample-badge';
    badge.setAttribute('data-output-type', type);
    badge.textContent = t('iaaSmallSampleBadge');
    thresholdRow.appendChild(badge);
  });
}

/* ── single_label IAA score card (issue #490) ─────────────────────
 * The single_label partial's score card used to hardcode 0.85/pass; this
 * derives the real value from computeIaaAlpha() (annotation-workspace.data.js
 * — the sole source of truth for the alpha formula, see IAA_NOMINAL_OUTPUT_TYPES)
 * and OUTPUT_TYPE_IAA_REGISTRY (task-config.data.js — the sole source of truth
 * for the pass threshold). IAA is advisory only: when not computable this
 * renders "not computable", never 0.00/undefined/NaN, and nothing here gates
 * any workflow. */
function applySingleLabelIaaCard() {
  var mount = document.getElementById('qualityPanelMount');
  if (!mount || !window.LabelSuiteAnnotationWorkspaceData) return;
  var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
  var outputs = (taskMeta && taskMeta.outputs && taskMeta.outputs.length) ? taskMeta.outputs : [S.type];
  var index = outputs.indexOf('single_label');
  if (index === -1) return;
  var scope = index === 0
    ? mount.querySelector('section[aria-labelledby="iaaTitle"]')
    : mount.querySelector('section[data-output-type="single_label"]');
  if (!scope) return;
  var valueEl = scope.querySelector('.iaa-card-value');
  var barEl = scope.querySelector('.iaa-bar-fill');
  var dotEl = scope.querySelector('.t-dot');
  var thrTextEl = scope.querySelector('.iaa-threshold-item span:last-child');
  if (!valueEl || !barEl || !dotEl || !thrTextEl) return;

  var listTask = ((window.LabelSuiteTaskListData && window.LabelSuiteTaskListData.tasks) || [])
    .filter(function(task) { return task.id === S_ROUTE.taskId; })[0];
  var runType = (listTask && listTask.runType === 'official_run') ? 'official_run' : 'dry_run';
  var result = window.LabelSuiteAnnotationWorkspaceData.computeIaaAlpha(S_ROUTE.taskId, runType, 'single_label');
  var threshold = OUTPUT_TYPE_IAA_REGISTRY.single_label.defaultThreshold;

  var state = !result.computable ? 'warn' : (result.alpha >= threshold ? 'pass' : 'fail');
  valueEl.className = 'iaa-card-value ' + state;
  valueEl.textContent = result.computable ? result.alpha.toFixed(2) : t('iaaNotComputable');
  barEl.className = 'iaa-bar-fill ' + state;
  barEl.style.width = (result.computable ? Math.max(0, Math.min(1, result.alpha)) * 100 : 0) + '%';
  dotEl.className = 't-dot t-dot-' + state;
  var resultText = result.computable
    ? tPath('singleLabelQuality.' + (state === 'pass' ? 'passLabel' : 'failLabel'))
    : t('iaaNotComputable');
  thrTextEl.innerHTML = fmt(tPath('singleLabelQuality.thresholdFmt'), { threshold: threshold.toFixed(2) })
    + ' — <strong class="t-' + state + '">' + resultText + '</strong>';
}

function wireAltToggle(btnId, bodyId) {
  var btn = document.getElementById(btnId);
  var body = document.getElementById(bodyId);
  if (!btn || !body) return;
  btn.addEventListener('click', function() {
    var open = body.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open);
    body.setAttribute('aria-hidden', !open);
  });
}

function closeAllAltToggles() {
  ['altBtnVA','altBtnCls','altBtnSeq','altBtnRel','altBtnSingleLabel','altBtnSingleDim'].forEach(function(id) {
    var btn = document.getElementById(id);
    var bodyId = id.replace('altBtn', 'altBody');
    var body = document.getElementById(bodyId);
    if (btn) {
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
    if (body) {
      body.classList.remove('open');
      body.setAttribute('aria-hidden', 'true');
    }
  });
}

function wireSequenceToggle() {

/* ── outputs[] composition helpers (ADR-029 / spec 017 v2.0.0) ────── */
function namespaceIds(root, suffix) {
  var idMap = {};
  Array.prototype.forEach.call(root.querySelectorAll('[id]'), function(el) {
    var oldId = el.getAttribute('id');
    var newId = oldId + '__' + suffix;
    idMap[oldId] = newId;
    el.setAttribute('id', newId);
  });
  ['aria-labelledby', 'aria-controls', 'aria-describedby', 'for'].forEach(function(attr) {
    Array.prototype.forEach.call(root.querySelectorAll('[' + attr + ']'), function(el) {
      var val = el.getAttribute(attr);
      if (idMap[val]) el.setAttribute(attr, idMap[val]);
    });
  });
}

function buildSecondaryIaaBlock(html, type) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var section = doc.querySelector('section[aria-labelledby="iaaTitle"]');
  if (!section) return null;
  var body = section.querySelector('.iaa-score-grid') || section.querySelector('.iaa-not-applicable-note');
  if (!body) return null;
  var clone = body.cloneNode(true);
  namespaceIds(clone, type);
  var wrap = document.createElement('section');
  wrap.className = 'panel';
  wrap.setAttribute('data-output-type', type);
  var subtitle = document.createElement('p');
  subtitle.className = 'panel-subtitle iaa-type-label';
  subtitle.textContent = (OUTPUT_TYPE_LABELS[S.lang] || OUTPUT_TYPE_LABELS.zh)[type] || type;
  wrap.appendChild(subtitle);
  wrap.appendChild(clone);
  return wrap;
}

function loadQualityPanel() {
  var mount = document.getElementById('qualityPanelMount');
  var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
  var outputs = (taskMeta && taskMeta.outputs && taskMeta.outputs.length) ? taskMeta.outputs : [S.type];
  if (!mount) return Promise.resolve();
  mount.innerHTML = '';
  var finish = function() {
    SIMPLE_IDS.forEach(function(id) { setText(id, id); });
    applyDataI18n(mount);
    updateLowConsistencyCountBadge();
    updateConsistencyDeviationTexts();
    closeAllAltToggles();
    syncSequenceUi();
    updateMethodName();
    updateSummaryBadge();
    applySmallSampleBadge();
    applySingleLabelIaaCard();
    syncRoleUi();
    wireQualityPanelInteractions();
  };
  if (outputs.length <= 1) {
    var path = QUALITY_PANEL_PATHS[outputs[0]] || QUALITY_PANEL_PATHS.multi_label;
    if (!path) return Promise.resolve();
    return fetch(path, { cache: 'no-store' })
      .then(function(response) {
        if (!response.ok) throw new Error('Failed to load panel partial: ' + path);
        return response.text();
      })
      .then(function(html) { mount.innerHTML = html.trim(); finish(); })
      .catch(function() { renderPanelLoadError(); });
  }
  /* Composite task: 區塊A per-type IAA cards (outputs[] order, primary mounted in
     full then secondaries appended as IAA-only cards) followed by 區塊B — the
     primary type's shared anomaly/risk/consistency sections, which stay singular
     per task (spec.md:293-322). */
  return Promise.all(outputs.map(function(type) {
    return fetch(QUALITY_PANEL_PATHS[type], { cache: 'no-store' })
      .then(function(r) { if (!r.ok) throw new Error('Failed to load panel partial: ' + type); return r.text(); });
  })).then(function(htmlList) {
    mount.innerHTML = htmlList[0].trim();
    var iaaSection = mount.querySelector('section[aria-labelledby="iaaTitle"]');
    var insertAfter = iaaSection;
    for (var i = 1; i < outputs.length; i += 1) {
      var block = buildSecondaryIaaBlock(htmlList[i], outputs[i]);
      if (!block) continue;
      if (insertAfter && insertAfter.parentNode === mount) {
        mount.insertBefore(block, insertAfter.nextSibling);
        insertAfter = block;
      } else {
        mount.appendChild(block);
        insertAfter = block;
      }
    }
    finish();
  }).catch(function() { renderPanelLoadError(); });
}

/* ── Header texts per type ──────────────────────────────────────── */
function applyTypeContent() {
  var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
  var localizedTitle = taskMeta && taskMeta.title ? (taskMeta.title[S.lang] || taskMeta.title.zh || taskMeta.title.en) : '';

  document.getElementById('bcCurrent').textContent = localizedTitle;
  updateTaskDetailHref();
  syncRoleUi();
  return Promise.all([loadStatsPanel(), loadQualityPanel()]);
}

/* ── Quality state ──────────────────────────────────────────────── */
function applyQualityState() {
  var isEmpty = S.qState !== 'ready';
  document.getElementById('qualityEmpty').classList.toggle('hidden', !isEmpty);
  document.getElementById('qualityReady').classList.toggle('hidden', isEmpty);
  if (isEmpty) {
    var msgs = (t('emptyStateMsgs') || I18N.zh.emptyStateMsgs)[S.qState];
    if (msgs) {
      document.getElementById('emptyTitle').textContent = msgs[0];
      document.getElementById('emptyDesc').textContent  = msgs[1];
    }
    var taskMeta = TASK_META[S_ROUTE.taskId] || TASK_META[DEFAULT_TASK_ID];
    var outputs = (taskMeta && taskMeta.outputs) || [];
    var counted = outputs.filter(function(type) {
      return IAA_GATE_EXCLUDED_TYPES.indexOf(type) === -1 && IAA_UNCALIBRATED_TYPES.indexOf(type) === -1;
    });
    var pendingBadge = document.getElementById('qualityPendingBadge');
    if (pendingBadge) pendingBadge.textContent = fmt(t('iaaPendingBadgeFmt'), { y: counted.length });
  }
}

/* ── Tabs ────────────────────────────────────────────────────────── */
function syncUrlState() {
  var params = new URLSearchParams(window.location.search);
  params.set('task_id', S_ROUTE.taskId);
  params.set('tab', S.tab);
  if (S.qState !== 'ready') params.set('q_state', S.qState);
  else params.delete('q_state');
  window.history.replaceState({}, '', window.location.pathname + '?' + params.toString());
}

function switchTab(nextTab) {
  var main = document.getElementById('detailMain');
  if (main && S.tab) S.scrollTopByTab[S.tab] = main.scrollTop;
  S.tab = nextTab;
  var isStats = nextTab === 'stats';
  var statsTab = document.getElementById('tabStats');
  var qualityTab = document.getElementById('tabQuality');
  statsTab.classList.toggle('active', isStats);
  statsTab.setAttribute('aria-selected', isStats ? 'true' : 'false');
  qualityTab.classList.toggle('active', !isStats);
  qualityTab.setAttribute('aria-selected', isStats ? 'false' : 'true');
  document.getElementById('statsPanel').classList.toggle('hidden', !isStats);
  document.getElementById('qualityPanel').classList.toggle('hidden', isStats);
  syncUrlState();
  if (main) main.scrollTop = S.scrollTopByTab[nextTab] || 0;
}

document.getElementById('tabStats').addEventListener('click', function() {
  switchTab('stats');
});
document.getElementById('tabQuality').addEventListener('click', function() {
  switchTab('quality');
});

var toastCloseBtn = document.getElementById('toastClose');
if (toastCloseBtn) toastCloseBtn.addEventListener('click', function() {
  var toastNode = document.getElementById('toast');
  if (toastNode) toastNode.classList.remove('visible');
});

function resetSequenceAndAltViews() {
  S.seqMode = 'strict';
}

function applyRouteTask(taskId) {
  var taskMeta = TASK_META[taskId] || TASK_META[DEFAULT_TASK_ID];
  S_ROUTE.taskId = TASK_META[taskId] ? taskId : DEFAULT_TASK_ID;
  S.type = taskMeta.outputs[0];
  resetSequenceAndAltViews();
  return applyTypeContent();
}

/* ── Init ────────────────────────────────────────────────────────── */
(function() {
  var params;
  try {
    params = new URLSearchParams(window.location.search);
    var routeTaskId = params.get('task_id');
    if (!routeTaskId || !TASK_META[routeTaskId]) {
      /* FR-002 / INVALID_TASK_TRIGGER: unknown or missing task_id must redirect
         to the list with an error toast, not silently fall back to a default
         task (issue #261 drift). */
      window.location.href = './dataset-analysis-list.html?invalid_task=1';
      return;
    }
    applyRouteTask(routeTaskId);
    var qState = params.get('q_state');
    if (qState === 'dry_run_in_progress' || qState === 'report_pending' || qState === 'report_generating' || qState === 'ready') {
      S.qState = qState;
    }
  } catch(e) {
    applyRouteTask(DEFAULT_TASK_ID);
  }

  try {
    var stored = window.LabelSuiteSharedSidebar.getStoredLang();
    applyLang(stored || 'zh');
  } catch(e) { applyLang('zh'); }

  applyStatsState();

  /* Read ?tab= from URL */
  try {
    var tab = (params || new URLSearchParams(window.location.search)).get('tab');
    switchTab(tab === 'quality' ? 'quality' : 'stats');
  } catch(e) {}

  if (window.LabelSuiteAnalytics) {
    window.LabelSuiteAnalytics.init({ page: 'dataset-analysis-detail' });
    window.LabelSuiteAnalytics.trackPageView('dataset-analysis-detail', function() {
      return { taskId: S_ROUTE.taskId, taskType: S.type, tab: S.tab };
    });
  }

  ['langToggle', 'mobileLangToggle'].forEach(function(id) {
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', function() {
      applyLang(S.lang === 'zh' ? 'en' : 'zh');
    });
  });
})();
