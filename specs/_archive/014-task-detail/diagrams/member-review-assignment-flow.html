    <h1>成員與審核指派管理流程（專案負責人視角）</h1>
    <p class="standfirst">專案負責人在任務詳情裡決定的是「誰有資格審」，不是「誰審哪一筆」。從把人加進任務、看見每位審核員的負荷，到勾選審核員與仲裁者名冊、通過發布前驗證——整條路上只有一道真正會擋人的閘門，而逐筆指派從頭到尾都不在負責人手上。</p>

    <svg viewBox="0 0 1200 1176" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mra-title mra-desc">
      <title id="mra-title">成員與審核指派管理流程（專案負責人視角）</title>
      <desc id="mra-desc">流程圖，說明專案負責人在任務詳情的成員管理與審核設定中的操作順序，以及發布前的唯一驗證閘門。起點是專案負責人開啟任務詳情的成員管理分頁，此分頁僅專案負責人可見。第一步是新增成員並指派任務角色，入口分成搜尋平台成員與 Email 邀請兩種，未輸入關鍵字前不顯示任何名單，已在任務者會被排除，角色一旦加入即為唯讀，要更改必須先移除再重新加入。第二步是成員清單，其中審核負荷欄對標記員顯示破折號，對審核員顯示已指派筆數與待審筆數，已指派恆為待審加已完成的推導值、不獨立儲存。第三步是審核指派區塊，這是圖上的第一個焦點：自版本三點零起本區塊恆為唯讀，指派一律由系統自動執行，沒有自動補齊、沒有逐列指派按鈕，區塊內為每位啟用中審核員列出已指派、待審、已完成三欄，具仲裁資格者加註仲裁標籤，底部兩列為唯讀資訊列，分別顯示待仲裁項數與最終例外池待處置項數。第四步是總覽分頁的審核設定，以兩份勾選清單寫入審核員名冊與仲裁者名冊，仲裁者必須是審核員名冊的子集，兩者的值都是成員關係的使用者代號，不得寫入電子郵件或顯示名稱。接著是圖上第二個焦點，也是全流程唯一的閘門：發布前驗證，條件是啟用中標記員人數達到最低標記員數，且審核員名冊中至少有一位啟用中的人。不足時阻擋發布並顯示還差幾位，負責人回到成員清單補人後重新驗證；通過則任務發布，系統開始自動分派審核，指派來源恆為自動輪派。圖的右上另有一條支線：移除或停用審核員時，若其仍有未完成作業需二次確認，其待審負荷退回未指派池由系統重新分派，已完成則保留為歷史統計。</desc>
