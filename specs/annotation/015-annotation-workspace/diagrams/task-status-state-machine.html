    <h1>Task 狀態機</h1>
    <p class="standfirst">任務的五個狀態一路向前，只有一條反向出口：<code>waiting_iaa_confirmation → draft</code>。最容易被誤解的是 <code>dry_run_in_progress → draft</code>——它<strong>刻意</strong>不被允許，而不是還沒實作。這張圖畫出完整狀態集合、每條合法轉換的前置條件、<code>completed</code> 於 2026-08-19 強化後的五項條件，以及 <code>sample_snapshot_id</code> 的設定／清除不變量。</p>

    <svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tssm-title tssm-desc">
      <title id="tssm-title">Task 五態狀態機</title>
      <desc id="tssm-desc">任務狀態機由上而下五個節點：草稿 draft、試標進行中 dry_run_in_progress、等待 IAA 確認 waiting_iaa_confirmation、正式標記進行中 official_run_in_progress、已完成 completed，已完成為終態。向前的四條轉換各有前置條件：草稿轉試標需至少兩位標記員已指派、設定通過驗證、樣本快照鎖定，並於首次轉入時設定 sample_snapshot_id；試標轉等待確認需所有試標標記已提交且 IAA 已計算；等待確認轉正式標記需專案負責人確認 IAA 並記錄 confirmed_by；正式標記轉已完成需五項前置條件全數成立。唯一允許的反向轉換是等待 IAA 確認回到草稿，觸發條件為專案負責人否決 IAA，並清除 sample_snapshot_id。試標進行中回到草稿刻意不被允許，圖上以叉號與不允許徽章標示。右欄依序列出已完成的五項前置條件與其中第二項的規格待定註記、sample_snapshot_id 不變量、所有不允許的轉換，以及每次成功轉換的稽核與副作用契約。</desc>
