<body>
  <div class="frame">
    <p class="eyebrow">流程圖 · 資料集分析 · 品質監控</p>
    <h1>試標品質判讀與開放正式標記的決策流程</h1>
    <p class="standfirst">試標跑完之後，系統會依任務的輸出類型逐一判讀一致性，結果只有四種：不用算的、算不出來的、沒過門檻的、全部通過的。這裡沒有任何一道門——四種結果一律只是顧問性的資訊與警示，沒有一種會阻擋任務進入正式標記。什麼時候開放正式標記，由專案負責人自己決定。</p>

    <svg viewBox="0 0 1200 1248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iaaq-title iaaq-desc">
      <title id="iaaq-title">試標品質判讀與開放正式標記的決策流程</title>
      <desc id="iaaq-desc">流程圖，說明一輪試標完成後系統如何逐個輸出類型判讀標記一致性，以及判讀結果如何影響開放正式標記的決定。起點是試標回合完成、開啟品質監控，一致性以單一回合為計算單位、不跨回合累積。接著有三個判斷：第一，這一型要不要算一致性——自由文字不算，直接落到「不適用，由審核員評估」，不列入達標分母；第二，這一型算不算得出來——有效樣本少於兩筆或有效標記員少於兩位時數學上沒有定義，落到「無法計算」，必須寫明原因，不可退而顯示 0.00；第三，整個任務是不是全數達標——採全數達標而非多數決，有任一型沒過就落到「未達標，顯示明顯警示」，全部通過則落到「全數達標」。四種結果都不是關卡，四條線一律匯流到同一個終點：由專案負責人自己決定何時開放正式標記，系統只給建議與警示，不會擋人；決定前一併參考異常偵測（標記速度過快或過慢、離群標記值）與標記員風險等級。小樣本是特例但不佔判斷節點：完成標記員少於五位時只是提醒估計不穩，不改變達標判定，也一樣不擋人。圖的下方另列出決定之後的兩個導頁出口：審核標記與調整參與狀態，兩者僅專案負責人可執行，審核員只能查看。</desc>

      <defs>
        <marker id="arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748B"/></marker>

      <path d="M 280 256 V 336" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>

      <path d="M 400 200 H 552" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 400 400 H 552" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 400 600 H 552" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>
      <path d="M 280 656 V 728 A 8 8 0 0 0 288 736 H 552" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arw)"/>

      <!-- 四條結果線：全部 accent，全部通到同一個終點 -->
      <path d="M 880 200 H 992 A 8 8 0 0 1 1000 208 V 892" fill="none" stroke="#6366F1" stroke-width="1.2" marker-end="url(#arw-ac)"/>
      <path d="M 880 400 H 968 A 8 8 0 0 1 976 408 V 892" fill="none" stroke="#6366F1" stroke-width="1.2" marker-end="url(#arw-ac)"/>

      <text x="412" y="188" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">不用算 · 自由文字</text>

      <rect x="290" y="292" width="28" height="12" rx="2" fill="#F5F3FF"/>
      <text x="294" y="300" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">要算</text>

      <rect x="408" y="380" width="44" height="12" rx="2" fill="#F5F3FF"/>
      <text x="412" y="388" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">算不出來</text>

      <rect x="290" y="492" width="44" height="12" rx="2" fill="#F5F3FF"/>
      <text x="294" y="500" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace">算得出來</text>

      <rect x="408" y="580" width="72" height="12" rx="2" fill="#F5F3FF"/>

      <!-- ══ 節點 ══ -->
      <!-- 起點 -->
      <rect x="160" y="48" width="240" height="56" rx="20" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="280" y="76" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">試標回合完成，開啟品質監控</text>
      <text x="280" y="92" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">單回合計算 · 不跨回合累積</text>

      <!-- 判斷 1 -->
      <polygon points="280,144 400,200 280,256 160,200" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="280" y="196" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">這一型要算一致性嗎？</text>
      <text x="280" y="212" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">逐個輸出類型各判一次</text>

      <!-- 判斷 2 -->
      <polygon points="280,344 400,400 280,456 160,400" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="280" y="396" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">這一型算得出來嗎？</text>
      <text x="280" y="412" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">要 2 筆以上樣本、2 位以上標記員</text>

      <!-- 判斷 3 -->
      <polygon points="280,544 400,600 280,656 160,600" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="280" y="596" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">整個任務都達標了嗎？</text>
      <text x="280" y="612" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">要全數達標 · 不是多數決</text>

      <!-- 結果 A：不適用 -->
      <rect x="560" y="156" width="320" height="88" rx="6" fill="#1E1B4B0D" stroke="#64748B" stroke-width="1"/>
      <text x="720" y="184" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">不適用 — 由審核員評估</text>
      <text x="720" y="204" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">不列入 x/y 達標分母</text>
      <text x="720" y="220" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">任務只有自由文字時整體＝not_applicable</text>
      <text x="720" y="236" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">IAA_GATE_EXCLUDED_TYPES=free_text · FR-012M · FR-024B</text>

      <!-- 結果 B：無法計算 -->
      <rect x="560" y="356" width="320" height="88" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="720" y="384" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">無法計算</text>
      <text x="720" y="404" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">數學上沒有定義 · 必須寫明原因</text>
      <text x="720" y="420" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">不可退而顯示 0.00</text>
      <text x="720" y="436" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">AC-3.16 · FR-039 第 4 點 · SC-029</text>

      <!-- 結果 C：未達標 -->
      <rect x="560" y="556" width="320" height="88" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="720" y="584" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">未達標 · 顯示明顯警示</text>
      <text x="720" y="604" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">紅色標出沒過門檻的型別</text>
      <text x="720" y="620" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">警示而已 · 不會擋住進入正式標記</text>
      <text x="720" y="636" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">x &lt; y · FR-039 第 1 點 · FR-013</text>

      <!-- 結果 D：全數達標 -->
      <rect x="560" y="692" width="320" height="88" rx="6" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
      <text x="720" y="720" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">全數達標</text>
      <text x="720" y="740" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">綠色標示 · x/y 全部通過</text>
      <text x="720" y="756" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">仍建議先看一眼風險標記員</text>
      <text x="720" y="772" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">IAA_COMPOSITE_GATE_RULE = pass ⟺ x == y AND y &gt; 0 · FR-013</text>

      <!-- ══ 小樣本特例：編輯性旁註，不佔節點 ══ -->
      <text x="40" y="812" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">小樣本是特例，不是第四個判斷：少於 5 位標記員時，</text>
      <text x="40" y="836" fill="#64748B" font-size="14" font-style="italic" font-family="'Crimson Pro','Noto Serif TC',serif">只是提醒估計不穩，不改變達標判定，也一樣不擋人。</text>
      <text x="40" y="860" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">IAA_SMALL_SAMPLE_THRESHOLD = 5 · FR-034 · AC-3.11</text>

      <text x="576" y="884" fill="#64748B" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">四條路都通到這裡 · 沒有一條是門</text>

      <!-- 焦點節點：全流程唯一的決定點 -->
      <rect x="560" y="900" width="600" height="120" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
      <text x="860" y="940" fill="#1E1B4B" font-size="12" font-weight="600" font-family="'Inter','Noto Sans TC',sans-serif" text-anchor="middle">由專案負責人自己決定何時開放正式標記</text>
      <text x="860" y="964" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">系統只給建議與警示 · 四種結果都不會擋人</text>
      <text x="860" y="984" fill="#64748B" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">決定前一併看異常偵測（標記太快／太慢、離群標記值）與標記員風險等級</text>
      <text x="860" y="1004" fill="#94A3B8" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">FR-039 第 1 點 · FR-014 · FR-025</text>

      <line x1="40" y1="1060" x2="1160" y2="1060" stroke="rgba(30,27,75,0.10)" stroke-width="0.8"/>

      <text x="444" y="1100" fill="#64748B" font-size="9" font-family="'Inter','Noto Sans TC',sans-serif">結果線 · 不阻擋，一律匯流到人工判斷</text>

      <!-- ══ 延伸資訊帶：決定之後的兩個導頁出口 ══ -->
      <line x1="40" y1="1136" x2="1160" y2="1136" stroke="rgba(30,27,75,0.10)" stroke-width="0.8"/>
